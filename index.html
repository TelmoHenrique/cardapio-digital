<p>Pra permitir o seu acesso, mostrar os números do seu restaurante, calcular metas e indicadores, manter o histórico de importações e garantir a segurança do sistema. Não vendemos nem usamos os dados pra publicidade.</p>
<h3>3. Com quem compartilhamos</h3>
<p>Só com os fornecedores de infraestrutura necessários pro sistema funcionar: o <b>Supabase</b> (banco de dados e autenticação, com servidores em São Paulo) e a <b>Vercel</b> (hospedagem do site). Os dados de cada restaurante ficam isolados e só são visíveis pros usuários desse restaurante.</p>
<h3>4. No seu aparelho</h3>
<p>O sistema guarda no navegador a sessão de acesso, pra você não precisar entrar toda vez, e, se você marcar "Lembrar meu usuário", o nome de usuário. Não usamos cookies de propaganda nem de rastreamento.</p>
<h3>5. Por quanto tempo</h3>
<p>Enquanto durar a contratação do serviço. Depois do encerramento, os dados podem ser excluídos a pedido do cliente, ressalvadas as hipóteses de guarda previstas em lei.</p>
<h3>6. Seus direitos</h3>
<p>Você pode pedir a confirmação e o acesso aos seus dados, a correção de dados incompletos ou desatualizados, a portabilidade, a eliminação e informações sobre compartilhamento, entre os demais direitos previstos no art. 18 da LGPD.</p>
<h3>7. Segurança</h3>
<p>Usamos conexão criptografada (HTTPS), senhas criptografadas e regras no banco de dados que impedem um cliente de ver os dados de outro.</p>
<h3>8. Contato</h3>
<p>Dúvidas ou pedidos sobre seus dados: ${LEGAL_CONTATO}.</p>
<p class="legal-data">Última atualização: ${LEGAL_ATUALIZADO}.</p>`;

    <div class="legal-txt">${tipo === 'termos' ? TEXTO_TERMOS : TEXTO_PRIVACIDADE}</div>
  </div>`;
  const fechar = () => { bg.remove(); document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key === 'Escape') fechar(); };
  bg.addEventListener('click', e => { if (e.target === bg) fechar(); });

}

function alertasAtuais(t){
  if (!state.config || !state.config.metas_ativas) return [];
  const tAnt = totaisPorTipo(state.lancAnt);
  const linhas = [
    { key:'custo', label:'Custo acima da meta', metaPct: Number(state.config.reducao_custo_pct)/100, direcao:'baixo' },
    { key:'despesa', label:'Despesa acima da meta', metaPct: Number(state.config.reducao_despesa_pct)/100, direcao:'baixo' }
  ];
  return linhas.filter(l => {
    const variacao = tAnt[l.key] ? (t[l.key] - tAnt[l.key]) / tAnt[l.key] : 0;
    return l.direcao === 'cima' ? variacao < l.metaPct : variacao > -l.metaPct;
  });
}

/* ---------- próxima atualização automática (robô Tacto no GitHub) ---------- */
const ROBO_HORARIOS = ['09:00', '14:00', '18:00', '22:00']; // horário de Cuiabá (igual ao robo-tacto.yml)
function agoraCuiaba(){
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone:'America/Cuiaba', hour12:false,
    year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return { min: (+p.hour % 24) * 60 + +p.minute };
}
function infoRobo(){
  const agora = agoraCuiaba().min;
  const slots = ROBO_HORARIOS.map(h => { const [a, b] = h.split(':').map(Number); return a * 60 + b; }).sort((a, b) => a - b);
  // o GitHub pode atrasar alguns minutos: até 45 min depois do horário, se ainda não chegou dado novo, mostra "atualizando"
  const ult = state.ultimaImport ? new Date(state.ultimaImport) : null;
  for (const s of slots) {
    if (agora >= s && agora - s <= 45) {
      const inicio = new Date(Date.now() - (agora - s) * 60000);
      if (!ult || ult < inicio) return { atualizando:true, slot:`${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` };
    }
  }
  let prox = slots.find(s => s > agora);
  const falta = prox === undefined ? slots[0] + 1440 - agora : prox - agora;
  return { falta };
}
function textoRobo(){
  const r = infoRobo();
  if (r.atualizando) return { longo:`aguardando a atualização das ${r.slot}…`, curto:`aguardando ${r.slot}…` };
  const h = Math.floor(r.falta / 60), m = r.falta % 60;
  const t = h ? `${h}h ${String(m).padStart(2, '0')}min` : `${m}min`;
  return { longo:`próxima atualização em ${t}`, curto:`atualiza em ${h ? h + 'h' + String(m).padStart(2, '0') : m + 'min'}` };
}
function tituloRobo(){
  let ult = '';
  if (state.ultimaImport) {
    const d = new Date(state.ultimaImport), hoje = new Date();
    const dia = d.toDateString() === hoje.toDateString() ? 'hoje' : d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
    ult = ` · última: ${dia} às ${d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' })}`;
  }
  return `Os dados são buscados no Tacto automaticamente às ${ROBO_HORARIOS.slice(0, -1).join(', ')} e ${ROBO_HORARIOS.slice(-1)} (horário de Cuiabá)${ult}`;
}

  if (cmpSel) cmpSel.onchange = e => { state.competenciaComparar = e.target.value === state.competenciaAnterior ? '' : e.target.value; state.lancCmp = state.hist[mesCmp()] || {}; renderComTransicao(); };

  document.querySelectorAll('.side button').forEach(b => b.onclick = () => {
    if (state.tab !== b.dataset.tab && window.scrollY > 0) window.scrollTo({ top:0, behavior: reduzMovimento() ? 'auto' : 'smooth' });
    state.tab = b.dataset.tab; render();
  });
  if (state.tab === 'importar') bindImportar();
  atualizarBotoesInstalar();
  if (nAlertas) state.pulsouAlerta = true;
  if (state.tab === 'painel' && window.innerWidth > 820) sincronizarAlturaPainel();
  posicionarIndicadorMenu();

  if (state.tab === 'dre') { bindGruposDre(); bindDreScroll(); bindNavTabelaDre(); bindEvolucaoAno(); document.querySelectorAll('.dre-meses [data-dm]').forEach(b => b.onclick = () => { state.dreMeses = b.dataset.dm; state.dreScrollX = null; try { localStorage.setItem('vg_dre_meses', b.dataset.dm); } catch (e) {} render(); }); }
  if (state.tab === 'metas') bindMetasForm();

  document.querySelectorAll('#conteudo [data-cod]').forEach(el => el.addEventListener('click', () => abrirHistoricoConta(el.dataset.cod, el)));
}

function topContas(tipo, limite){
  const contas = state.contas.filter(c => c.tipo === tipo && (state.lanc[c.codigo] || 0) !== 0);
  const total = contas.reduce((s, c) => s + (state.lanc[c.codigo] || 0), 0);
  return contas.map(c => {
    const valor = state.lanc[c.codigo] || 0;
    return { codigo: c.codigo, nome: c.nome, valor, pctDoTotal: total ? valor / total : 0 };
  }).sort((a, b) => b.valor - a.valor).slice(0, limite || 5);
}

function topCardHtml(tipo, titulo, corVar){
  const itens = topContas(tipo, 5);
  if (!itens.length) return `<div class="topcard t-${tipo}"><h3>${titulo}</h3><p class="hint">Sem valores lançados neste mês.</p></div>`;
  const max = Math.max(...itens.map(i => i.valor), 1);
  return `<div class="topcard t-${tipo}"><h3>${titulo}</h3>${itens.map(i => `
    <div class="barrow clk-row" data-cod="${esc(i.codigo)}">
      <div class="barrow-label">${esc(i.nome)}</div>
      <div class="barrow-val">${brl(i.valor)} · ${pct(i.pctDoTotal)}</div>
      <div class="barrow-track"><div class="barrow-fill" style="width:${Math.max(4, i.valor/max*100)}%;background:${corVar}"></div></div>
    </div>`).join('')}</div>`;
}

function contasCresceram(limite){
  return state.contas.map(c => {
    const atual = state.lanc[c.codigo] || 0;
    const anterior = state.lancCmp[c.codigo] || 0;
    if (!anterior || atual <= anterior) return null;
    return { codigo: c.codigo, nome: c.nome, tipo: c.tipo, atual, anterior, variacao: (atual - anterior) / anterior };
  }).filter(Boolean).sort((a, b) => b.variacao - a.variacao).slice(0, limite || 8);
}

/* ================= COMPARAR COM (qualquer mês) ================= */
function mesCmp(){ return state.competenciaComparar || state.competenciaAnterior; }
function nomeMesCmp(){ return MESES[+mesCmp().split('-')[1] - 1]; }
function opcoesComparar(){
  const lista = state.histMeses.filter(m => m !== state.competencia && m < state.competencia && (state.hist[m] || m === state.competenciaAnterior));
  return lista.slice().reverse();
}
function seletorComparar(){
  const ops = opcoesComparar();
  const atual = mesCmp();
  return `<label class="cmp-pick" title="Escolher o mês usado nas comparações do painel">
    <span>comparando com</span>
    <select id="cmpMes" aria-label="Comparar com qual mês">${ops.map(m => `<option value="${m}"${m === atual ? ' selected' : ''}>${esc(mesLabel(m))}${m === state.competenciaAnterior ? ' (anterior)' : ''}${state.hist[m] ? '' : ' · sem dados'}</option>`).join('')}</select>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </label>`;
}

/* dias já "vividos" do mês (pra comparar mês aberto de forma justa) */
function diasDoMes(c){ const [a, m] = c.split('-').map(Number); return new Date(a, m, 0).getDate(); }
function fatorMesAberto(){
  const p = projecaoMes(totaisPorTipo(state.lanc));
  return p ? { fator: p.diasMes / p.dias, dias: p.dias, diasMes: p.diasMes } : null;
}

/* ================= GRUPOS DE DESPESA ================= */
const GRUPOS_DESPESA = {
  '3.1':'Pessoal', '3.2':'Impostos', '3.3':'Administrativas', '3.4':'Aquisições',
  '3.5':'Manutenção', '3.6':'Honorários', '3.7':'Taxas e bancos', '3.8':'Marketing', '3.9':'Reformas'
};
function grupoDaConta(c){
  const g = c.pai_codigo && c.pai_codigo.split('.').length === 2 ? c.pai_codigo : c.codigo.split('.').slice(0, 2).join('.');
  return g;
}
function despesasPorGrupo(mapa){
  const out = {};
  for (const c of state.contas.filter(c => c.tipo === 'despesa')) {
    const g = grupoDaConta(c);
    out[g] = (out[g] || 0) + (mapa[c.codigo] || 0);
  }
  return out;
}
function viewDespesasGrupo(t){
  const atual = despesasPorGrupo(state.lanc), ant = despesasPorGrupo(state.lancCmp);
  const grupos = Object.keys({ ...atual, ...ant }).filter(g => atual[g] || ant[g])
    .map(g => ({ g, nome: GRUPOS_DESPESA[g] || ('Grupo ' + g), v: atual[g] || 0, a: ant[g] || 0 }))
    .sort((x, y) => y.v - x.v || y.a - x.a);
  if (!grupos.length) return `<p class="empty">Sem despesas lançadas neste mês.</p>`;
  const max = Math.max(...grupos.map(x => Math.max(x.v, x.a)), 1);
  const mc = mesCurto(mesCmp());
  const aberto = state.competencia === mesAtualReal();
  return `<div class="dg-wrap">
    <div class="dg-leg"><span><i class="dg-i-at"></i>${esc(mesCurto(state.competencia))}</span><span><i class="dg-i-ant"></i>${esc(mc)}</span></div>
    ${grupos.map(x => {
      const d = x.v - x.a;
      const varTxt = !x.a ? `<span class="dg-var novo">novo</span>`
        : Math.abs(d) < 0.5 ? `<span class="dg-var igual">igual</span>`
        : `<span class="dg-var ${d > 0 ? 'sub' : 'des'}"><span class="seta">${d > 0 ? '▲' : '▼'}</span> <span data-mk="dgv-${esc(x.g)}" ${numAttr(Math.abs(d))}>${brl(Math.abs(d))}</span></span>`;
      return `<div class="dg-row" title="${esc(x.nome)} (${esc(x.g)}): ${brl(x.v)} · ${esc(mc)}: ${brl(x.a)}">
        <div class="dg-nome"><b>${esc(x.nome)}</b><small>${t.despesa ? pct(x.v / t.despesa) : '—'} das despesas</small></div>
        <div class="dg-bars"><i class="dg-at" data-mk="dga-${esc(x.g)}" style="width:${Math.max(x.v ? 1.5 : 0, x.v / max * 100)}%"></i><i class="dg-ant" data-mk="dgb-${esc(x.g)}" style="width:${Math.max(x.a ? 1.5 : 0, x.a / max * 100)}%"></i></div>
        <div class="dg-val">${brl(x.v)}<small>era <span data-mk="dge-${esc(x.g)}" ${numAttr(x.a)}>${brl(x.a)}</span></small></div>
        ${varTxt}
      </div>`;
    }).join('')}
    ${aberto ? `<p class="dg-nota">O mês ainda está aberto: grupos como Pessoal só aparecem completos depois do fechamento.</p>` : ''}
  </div>`;
}

/* ================= CAIU EM RELAÇÃO AO MÊS COMPARADO ================= */
function receitasQueCairam(limite){
  const ab = fatorMesAberto();
  return state.contas.filter(c => c.tipo === 'receita').map(c => {
    const anterior = state.lancCmp[c.codigo] || 0;
    const real = state.lanc[c.codigo] || 0;
    const atual = ab ? real * ab.fator : real;
    if (!anterior || atual >= anterior) return null;
    return { codigo: c.codigo, nome: c.nome, atual, real, anterior, variacao: (atual - anterior) / anterior };
  }).filter(Boolean).sort((a, b) => (a.atual - a.anterior) - (b.atual - b.anterior)).slice(0, limite || 15);
}
function viewCaiu(){
  const itens = receitasQueCairam(15);
  const ab = fatorMesAberto();
  const nota = ab ? `<p class="caiu-nota">Mês em aberto (dados até o dia ${ab.dias}): comparamos o ritmo atual, ou seja, quanto cada receita deve fechar se continuar vendendo igual.</p>` : '';
  if (!itens.length) return `${nota}<p class="empty">Nenhuma receita caiu em relação a ${esc(mesLabel(mesCmp()))}.</p>`;
  return `<div class="growth-list growth-list-scroll caiu-list mk-fade" id="caiuList">${nota}${itens.map(c => `
    <div class="growth-row clk-row" data-cod="${esc(c.codigo)}">
      <div><div class="growth-name">${esc(c.nome)}</div><div class="growth-nums">era <span class="growth-era">${brl(c.anterior)}</span> <span class="caiu-delta">caiu ${brl(c.anterior - c.atual)}</span> · ${ab ? 'deve fechar em' : 'agora'} <span class="growth-agora">${brl(c.atual)}</span></div></div>
      <div class="growth-pct down-bad">${pct(c.variacao)}</div>
    </div>`).join('')}</div>`;
}

/* ================= CASCATA DO RESULTADO ================= */
function viewCascata(t, resultado){
  if (!t.receita) return `<p class="empty">Sem receita neste mês pra montar a cascata.</p>`;
  const grupos = despesasPorGrupo(state.lanc);
  let lista = Object.keys(grupos).filter(g => grupos[g] > 0).map(g => ({ nome: GRUPOS_DESPESA[g] || ('Grupo ' + g), v: grupos[g] })).sort((a, b) => b.v - a.v);
  if (lista.length > 5) {
    const resto = lista.slice(4).reduce((s, x) => s + x.v, 0);
    lista = lista.slice(0, 4).concat([{ nome:'Outras despesas', v: resto }]);
  }
  const negativos = Object.values(grupos).filter(v => v < 0).reduce((s, v) => s + v, 0);
  if (negativos) lista.push({ nome:'Ajustes/estornos', v: negativos });
  const passos = [{ nome:'Receita', ini:0, fim:t.receita, tipo:'receita', txt: brl(t.receita) }];
  let nivel = t.receita;
  passos.push({ nome:'Custo', ini:nivel - t.custo, fim:nivel, tipo:'custo', txt:'− ' + brl(t.custo) }); nivel -= t.custo;
  for (const g of lista) { passos.push({ nome:g.nome, ini:nivel - g.v, fim:nivel, tipo:'despesa', txt:'− ' + brl(g.v) }); nivel -= g.v; }
  const outrosTot = t.outros || 0;
  passos.push({ nome:'Resultado', ini:Math.min(0, resultado), fim:Math.max(0, resultado), tipo: resultado >= 0 ? 'resultado' : 'negativo', txt: brl(resultado), total:true });
  const min = Math.min(0, ...passos.map(p => p.ini)), max = Math.max(...passos.map(p => p.fim), 1);
  const esc_ = v => (v - min) / (max - min) * 100;
  return `<div class="wf-wrap" id="cascata">
    ${passos.map((p, i) => {
      const l = esc_(Math.min(p.ini, p.fim)), w = Math.max(0.8, esc_(Math.max(p.ini, p.fim)) - l);
      const pr = t.receita ? Math.abs(p.fim - p.ini) / t.receita : 0;
      const lig = i === 0 ? '' : ` data-lig="${esc_(p.total && resultado < 0 ? p.ini : p.fim)}"`;
      const sai = i > 0 && !p.total ? ' wf-sai' : '';
      return `<div class="wf-row${p.total ? ' wf-total' : ''}${i === 0 ? ' wf-first' : ''}"${lig} style="--i:${i}">
        <span class="wf-nome">${esc(p.nome)}</span>
        <div class="wf-track">${min < 0 ? `<i class="wf-zero" style="left:${esc_(0)}%"></i>` : ''}<i class="wf-bar wf-${p.tipo}${sai}" style="left:${l}%;width:${w}%"></i></div>
        <span class="wf-val wf-${p.tipo}">${p.txt}<small>${i === 0 ? '100%' : pct(pr)}</small></span>
      </div>`;
    }).join('')}
    <p class="wf-nota">Cada barra mostra quanto sai da receita até chegar no resultado.${outrosTot ? ` Contas "outros" (${brl(outrosTot)}) não entram no cálculo, igual no DRE.` : ''}</p>
  </div>`;
}

/* ================= RESUMO DO MÊS EM TEXTO ================= */
// Envolve os valores em destaque (R$ e %) pra eles contarem do zero quando o resumo aparece.
function numerosAnimados(html){
  return html.replace(/(<b[^>]*>)([+−-]?)(R\$[\s\u00a0][\d.]+,\d{2}|\d+(?:,\d+)?%)/g, (m, b, sinal, num) => {
    const ehPct = num.endsWith('%');
    const v = parseFloat(num.replace(/R\$[\s\u00a0]/, '').replace('%', '').replace(/\./g, '').replace(',', '.'));
    return `${b}${sinal}<span ${numAttr(ehPct ? v / 100 : v, ehPct ? 'pct' : 'brl')}>${num}</span>`;
  });
}
function viewResumoTexto(t, resultado){
  if (!t.receita && !t.custo && !t.despesa) return '';
  const mAtu = MESES[+state.competencia.split('-')[1] - 1];
  const cmpNome = mesLabel(mesCmp());
  const tCmp = totaisPorTipo(state.lancCmp);
  const proj = projecaoMes(t);
  const frases = [];
  // 1) vendas
  if (proj) {
    const vsCmp = tCmp.receita ? proj.receita / tCmp.receita - 1 : null;
    frases.push({ ico:'receita', html:`Até o dia ${proj.dias}, o restaurante vendeu <b class="c-rec">${brl(t.receita)}</b>. No ritmo atual, ${mAtu} deve fechar perto de <b class="c-rec">${brl(proj.receita)}</b>${vsCmp === null ? '' : `, ${Math.abs(vsCmp) < 0.005 ? 'praticamente igual a' : `<b class="${vsCmp >= 0 ? 'c-ok' : 'c-bad'}">${pct(Math.abs(vsCmp))} ${vsCmp >= 0 ? 'acima' : 'abaixo'}</b> de`} ${esc(cmpNome)}`}.` });
  } else {
    const vsCmp = tCmp.receita ? t.receita / tCmp.receita - 1 : null;
    frases.push({ ico:'receita', html:`Em ${mAtu} o restaurante vendeu <b class="c-rec">${brl(t.receita)}</b>${vsCmp === null ? '' : `, ${Math.abs(vsCmp) < 0.005 ? 'praticamente igual a' : `<b class="${vsCmp >= 0 ? 'c-ok' : 'c-bad'}">${pct(Math.abs(vsCmp))} ${vsCmp >= 0 ? 'a mais' : 'a menos'}</b> que`} ${esc(cmpNome)}`}.` });
  }
  // 2) o que mais pesou
  const pesos = state.contas.filter(c => (c.tipo === 'custo' || c.tipo === 'despesa') && (state.lanc[c.codigo] || 0) > 0)
    .map(c => ({ nome: c.nome, v: state.lanc[c.codigo] })).sort((a, b) => b.v - a.v);
  if (pesos.length) {
    const p = pesos[0];
    frases.push({ ico:'custo', html:`O gasto que mais pesou foi <b>${esc(capitaliza(p.nome.toLowerCase()))}</b>: ${brl(p.v)}${t.receita ? `, ou <b class="c-warn">${pct(p.v / t.receita)} de tudo que entrou</b>` : ''}.` });
  }
  // 3) conta que mais subiu (custos e despesas, em R$)
  const ab = fatorMesAberto();
  const subiu = state.contas.filter(c => c.tipo === 'custo' || c.tipo === 'despesa').map(c => {
    const a = state.lancCmp[c.codigo] || 0, v = state.lanc[c.codigo] || 0;
    return { nome: c.nome, a, v, d: v - a };
  }).filter(x => x.a > 0 && x.d > 0).sort((x, y) => y.d - x.d)[0];
  if (subiu) {
    frases.push({ ico:'despesa', html:`A conta que mais subiu foi <b>${esc(capitaliza(subiu.nome.toLowerCase()))}</b>: <b class="c-bad">+${brl(subiu.d)}</b> em relação a ${esc(cmpNome)} (de ${brl(subiu.a)} pra ${brl(subiu.v)})${ab ? ', mesmo com o mês ainda aberto' : ''}.` });
  } else if (Object.keys(state.lancCmp).length) {
    frases.push({ ico:'despesa', html:`Nenhum custo ou despesa ficou maior que em ${esc(cmpNome)} até agora. <b class="c-ok">Bom sinal.</b>` });
  }
  // 4) ponto de equilíbrio
  const pe = pontoEquilibrio(t);
  if (pe && !pe.invalido) {
    if (t.receita >= pe.pe) {
      frases.push({ ico:'resultado', html:`As vendas já passaram do ponto de equilíbrio (<b>${brl(pe.pe)}</b>): <b class="c-ok">${brl(t.receita - pe.pe)} acima</b>. Daqui pra frente, boa parte de cada venda vira lucro.` });
    } else {
      const falta = pe.pe - t.receita;
      const restam = proj ? proj.diasMes - proj.dias : 0;
      frases.push({ ico:'resultado', html:`Faltam <b class="c-bad">${brl(falta)}</b> em vendas pra chegar no ponto de equilíbrio (${brl(pe.pe)})${restam > 0 ? `, cerca de <b>${brl(falta / restam)} por dia</b> nos ${restam} dias que restam` : ''}.` });
    }
  } else if (pe && pe.invalido) {
    frases.push({ ico:'resultado', html:`Os custos variáveis estão maiores que a receita, então ainda não dá pra calcular o ponto de equilíbrio.` });
  }
  return `<section class="rs-card">
    <div class="rs-head"><span class="rs-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg></span>
      <div><h3>Resumo de ${mAtu}</h3><p class="hint">Em poucas palavras, o que os números estão dizendo</p></div></div>
    <ul class="rs-lista">${frases.map((f, i) => `<li class="t-${f.ico}" style="--i:${i}"><span class="rs-dot">${icone(f.ico)}</span><p class="mk-fade">${numerosAnimados(f.html)}</p></li>`).join('')}</ul>
  </section>`;
}

/* ================= TEMA CLARO / ESCURO ================= */
const TEMA_KEY = 'vg_tema';
const mqEscuro = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function temaEscolhido(){
  try { const v = localStorage.getItem(TEMA_KEY); return ['claro','escuro','auto'].includes(v) ? v : 'claro'; } catch (e) { return 'claro'; }
}
function temaEfetivo(){ const e = temaEscolhido(); return (e === 'escuro' || (e === 'auto' && mqEscuro && mqEscuro.matches)) ? 'dark' : 'light'; }
function aplicarTema(animar, origem){
  const root = document.documentElement;
  const novo = temaEfetivo();
  const efetivar = () => {
    root.dataset.theme = novo;
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', novo === 'dark' ? '#0A1319' : '#0F4C5C');
    document.querySelectorAll('.tema-btn').forEach(b => { b.innerHTML = iconeTema(temaEscolhido()); b.title = 'Aparência: ' + NOME_TEMA[temaEscolhido()]; });
  };
  if (animar && root.dataset.theme !== novo && !reduzMovimento()) {
    // Novo tema "se espalhando" num círculo que sai do botão (navegadores com View Transitions)
    if (origem && document.startViewTransition) {
      const r = origem.getBoundingClientRect();
      const x = r.left + r.width / 2, y = r.top + r.height / 2;
      const raio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      try {
        const vt = document.startViewTransition(efetivar);
        vt.ready.then(() => root.animate(
          { clipPath:[`circle(0px at ${x}px ${y}px)`, `circle(${raio}px at ${x}px ${y}px)`] },
          { duration:650, easing:'cubic-bezier(.4,0,.2,1)', pseudoElement:'::view-transition-new(root)' }
        )).catch(() => {});
        return;
      } catch (e) {}
    }
    root.classList.add('tema-trocando');
    clearTimeout(aplicarTema._t);
    aplicarTema._t = setTimeout(() => root.classList.remove('tema-trocando'), 450);
  }
  efetivar();
}
const NOME_TEMA = { claro:'Claro', escuro:'Escuro', auto:'Automático' };
const ICO_TEMA = {
  claro:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>',
  escuro:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  auto:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none"/>'
};
const iconeTema = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICO_TEMA[k]}</svg>`;
function botaoTema(){ return `<button class="tema-btn" id="temaBtn" type="button" aria-haspopup="menu" aria-label="Aparência (modo claro ou escuro)" title="Aparência: ${NOME_TEMA[temaEscolhido()]}">${iconeTema(temaEscolhido())}</button>`; }
function fecharMenuTema(){ const m = document.querySelector('.tema-menu'); if (m) m.remove(); document.removeEventListener('pointerdown', fecharMenuTema._fora, true); document.removeEventListener('keydown', fecharMenuTema._esc); }
function abrirMenuTema(btn){
  if (document.querySelector('.tema-menu')) return fecharMenuTema();
  const atual = temaEscolhido();
  const m = document.createElement('div');
  m.className = 'tema-menu'; m.setAttribute('role', 'menu');
  m.innerHTML = `<p class="tm-tit">Aparência</p>` + ['claro','escuro','auto'].map(k => `<button type="button" role="menuitemradio" aria-checked="${k === atual}" data-tema="${k}" class="${k === atual ? 'on' : ''}">
      ${iconeTema(k)}<span>${NOME_TEMA[k]}${k === 'auto' ? '<small>segue o celular/computador</small>' : ''}</span>${k === atual ? '<i>✓</i>' : ''}</button>`).join('');
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect();
  m.style.top = (r.bottom + 8) + 'px';
  m.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
  m.querySelectorAll('[data-tema]').forEach(b => b.addEventListener('click', () => {
    try { localStorage.setItem(TEMA_KEY, b.dataset.tema); } catch (e) {}
    fecharMenuTema(); aplicarTema(true, btn); btn.focus();
  }));
  fecharMenuTema._fora = e => { if (!m.contains(e.target) && !btn.contains(e.target)) fecharMenuTema(); };
  fecharMenuTema._esc = e => { if (e.key === 'Escape') { fecharMenuTema(); btn.focus(); } };
  document.addEventListener('pointerdown', fecharMenuTema._fora, true);
  document.addEventListener('keydown', fecharMenuTema._esc);
  const on = m.querySelector('.on'); if (on) on.focus();
}
if (mqEscuro) { const f = () => { if (temaEscolhido() === 'auto') aplicarTema(true); }; mqEscuro.addEventListener ? mqEscuro.addEventListener('change', f) : mqEscuro.addListener(f); }
aplicarTema(false);

/* ---------- indicadores (CMV, folha, margem) ---------- */
function folhaDe(mapa){
  return state.contas.filter(c => c.tipo === 'despesa' && c.pai_codigo === '3.1').reduce((s, c) => s + (mapa[c.codigo] || 0), 0);
}
function cfgNum(campo, padrao){ const v = state.config && state.config[campo]; return v == null ? padrao : Number(v); }

function viewIndicadores(t, resultado){
  if (!t.receita) return `<p class="empty">Sem receita neste mês pra calcular os indicadores.</p>`;
  const tAnt = totaisPorTipo(state.lancCmp);
  const resAnt = tAnt.receita - tAnt.custo - tAnt.despesa;
  const cmvMax = cfgNum('cmv_max_pct', 35), folhaMax = cfgNum('folha_max_pct', 25), margemMin = cfgNum('margem_min_pct', 10);
  const ind = [
    { nome:'CMV', desc:'custo ÷ receita', v: t.custo / t.receita, ant: tAnt.receita ? tAnt.custo / tAnt.receita : null,
      ref:`ideal até ${cmvMax}%`, limite: cmvMax/100, tipo:'max' },
    { nome:'Folha de pessoal', desc:'pessoal ÷ receita', v: folhaDe(state.lanc) / t.receita, ant: tAnt.receita ? folhaDe(state.lancCmp) / tAnt.receita : null,
      ref:`ideal até ${folhaMax}%`, limite: folhaMax/100, tipo:'max' },
    { nome:'Margem líquida', desc:'resultado ÷ receita', v: resultado / t.receita, ant: tAnt.receita ? resAnt / tAnt.receita : null,
      ref:`ideal acima de ${margemMin}%`, limite: margemMin/100, tipo:'min' }
  ];
  return `<div class="kpis">${ind.map(i => {
    const status = i.tipo === 'max'
      ? (i.v <= i.limite ? 'good' : i.v <= i.limite + 0.05 ? 'warn' : 'bad')
      : (i.v >= i.limite ? 'good' : i.v >= i.limite - 0.05 ? 'warn' : 'bad');
    let varTxt = '';
    if (i.ant !== null) {
      const pp = (i.v - i.ant) * 100;
      const ppAbs = Math.abs(pp).toLocaleString('pt-BR', { maximumFractionDigits:1 });
      const mesAnt = nomeMesCmp();
      varTxt = Math.abs(pp) < 0.05
        ? `<span class="kpi-var mk-fade">igual a ${mesAnt} (${pct(i.ant)})</span>`
        : `<span class="kpi-var mk-fade">${pp > 0 ? 'subiu' : 'caiu'} ${ppAbs} ${ppAbs === '1' ? 'ponto' : 'pontos'} vs ${mesAnt} (era ${pct(i.ant)})</span>`;
    }
    return `<div class="kpi ${status}" title="${esc(i.desc)}">
      <span class="kpi-label">${i.nome}</span>

  }).join('')}${kpiPontoEquilibrio(t)}</div>`;
}

/* ---------- gráfico de linha genérico (SVG, sem biblioteca) ---------- */
function linhaSvg(labels, series, W = 1000, H = 260){
  const pl = 64, pr = 14, pt = 12, pb = 28;
  const todos = series.flatMap(s => s.valores);
  let min = Math.min(0, ...todos), max = Math.max(0, ...todos);
  if (max === min) max = min + 1;
  const pad = (max - min) * 0.08; max += pad; if (min < 0) min -= pad;
  const x = i => labels.length === 1 ? pl + (W - pl - pr) / 2 : pl + i * (W - pl - pr) / (labels.length - 1);
  const y = v => pt + (max - v) * (H - pt - pb) / (max - min);
  const compacto = v => { const a = Math.abs(v); const s = v < 0 ? '-' : ''; return a >= 1000 ? s + 'R$ ' + (a/1000).toLocaleString('pt-BR', { maximumFractionDigits:0 }) + 'k' : s + 'R$ ' + a.toLocaleString('pt-BR', { maximumFractionDigits:0 }); };
  const ticks = [0, 1, 2, 3, 4].map(k => min + (max - min) * k / 4);
  let svg = `<svg class="evo-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">`;
  ticks.forEach(v => { svg += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${compacto(v)}</text>`; });
  if (min < 0) svg += `<line class="zero" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/>`;
  labels.forEach((l, i) => { svg += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(s => {
    const pts = s.valores.map((v, i) => `${x(i)},${y(v)}`).join(' ');
    if (s.valores.length > 1) svg += `<polyline points="${pts}" fill="none" style="stroke:${s.cor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.valores.forEach((v, i) => { svg += `<circle cx="${x(i)}" cy="${y(v)}" r="4" style="fill:${s.cor}"><title>${esc(s.nome)} · ${esc(labels[i])}: ${brl(v)}</title></circle>`; });
  });
  return svg + `</svg>`;
}

function mesesComDados(){ return state.histMeses.filter(m => state.hist[m]); }

function viewEvolucao(){
  const meses = mesesComDados();
  if (!meses.length) return `<p class="empty">Ainda não há meses importados.</p>`;
  const tot = meses.map(m => totaisPorTipo(state.hist[m]));
  const series = [
    { nome:'Receita', cor:'var(--ok)', valores: tot.map(t => t.receita) },
    { nome:'Custo', cor:'var(--warn)', valores: tot.map(t => t.custo) },
    { nome:'Despesa', cor:'var(--brand)', valores: tot.map(t => t.despesa) },
    { nome:'Resultado', cor:'var(--roxo)', valores: tot.map(t => t.receita - t.custo - t.despesa) }
  ];
  const nota = meses.length < 3 ? `<p class="evo-note">Por enquanto há ${meses.length} ${meses.length === 1 ? 'mês importado' : 'meses importados'}. O gráfico ganha forma conforme você importa os próximos relatórios (mostra até 12 meses).</p>` : '';
  return `<div class="evo-wrap">
    <div class="evo-legend">${series.map(s => `<span><i style="background:${s.cor}"></i>${s.nome}</span>`).join('')}</div>
    ${linhaSvg(meses.map(mesCurto), series, window.innerWidth <= 720 ? Math.max(300, window.innerWidth - 56) : 1000, window.innerWidth <= 720 ? 220 : 260)}
    ${nota}
  </div>`;
}

/* ---------- histórico de uma conta (modal) ---------- */
function abrirHistoricoConta(codigo, origem){
  const conta = state.contas.find(c => c.codigo === codigo);
  if (!conta) return;
  const meses = mesesComDados();
  const valores = meses.map(m => (state.hist[m] || {})[codigo] || 0);
  const cor = { receita:'var(--ok)', custo:'var(--warn)', despesa:'var(--brand)', outros:'var(--ink2)' }[conta.tipo] || 'var(--brand)';
  const meta = metaConta(conta.tipo, state.lancAnt[codigo] || 0);
  const real = state.lanc[codigo] || 0;
  const media = valores.length ? valores.reduce((s, v) => s + v, 0) / valores.length : 0;
  const nomeTipo = { receita:'Receita', custo:'Custo', despesa:'Despesa', outros:'Outros' }[conta.tipo];
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div><h2>${esc(conta.nome)}</h2><p class="hint">${nomeTipo} · código ${esc(conta.codigo)}</p></div>
      <button class="modal-close" aria-label="Fechar">×</button>
    </div>
    <div class="resumo">
      <div><span>${esc(mesCurto(state.competencia))}</span><b>${brl(real)}</b></div>
      <div><span>Meta</span><b>${meta === null ? '—' : brl(meta)}</b>${meta === null ? '' : `<em class="${metaOk(conta.tipo, meta, real) ? 'good' : 'bad'}">${pct(meta ? real / meta : 0)} da meta</em>`}</div>
      <div><span>Média do período</span><b>${brl(media)}</b></div>
    </div>
    <div class="evo-wrap">${linhaSvg(meses.map(mesCurto), [{ nome: conta.nome, cor, valores }], Math.max(300, Math.min(560, window.innerWidth - 80)), 220)}
      ${meses.length < 3 ? `<p class="evo-note">O histórico vai ficando mais completo conforme novos meses são importados.</p>` : ''}</div>
    ${conta.tipo === "custo" || conta.tipo === "despesa" ? `<button type="button" class="btn ghost hist-det" id="histDet">Ver lançamentos de ${esc(mesCurto(state.competencia))} (fornecedor, descrição, data)</button>` : ""}
    <div class="hist-list">${meses.slice().reverse().map((m, i, arr) => {
      const v = (state.hist[m] || {})[codigo] || 0;
      return `<div><span>${esc(capitaliza(mesLabel(m)))}</span><b>${brl(v)}</b></div>`;
    }).join('')}</div>
  </div>`;
  let fechando = false;
  const fechar = () => {
    if (fechando) return; fechando = true;
    document.removeEventListener('keydown', onEsc);
    const a = animarModalOrigem(bg, origem, true);
    if (a) a.finished.then(() => bg.remove(), () => bg.remove()); else bg.remove();
  };
  const onEsc = e => { if (e.key === 'Escape') fechar(); };
  bg.addEventListener('click', e => { if (e.target === bg) fechar(); });
  bg.querySelector('.modal-close').addEventListener('click', fechar);
  const hd = bg.querySelector('#histDet'); if (hd) hd.addEventListener('click', () => { bg.remove(); document.removeEventListener('keydown', onEsc); abrirDetalheConta(codigo); });
  document.addEventListener('keydown', onEsc);
  document.body.appendChild(bg);
  animarModalOrigem(bg, origem, false);
}

function viewComparativoMeses(t, resultado){
  const tAnt = totaisPorTipo(state.lancCmp);
  const resultadoAnt = tAnt.receita - tAnt.custo - tAnt.despesa;
  const categorias = [
    { nome:'Receita', atual:t.receita, anterior:tAnt.receita, cor:'var(--ok)' },
    { nome:'Custo', atual:t.custo, anterior:tAnt.custo, cor:'var(--warn)' },
    { nome:'Despesa', atual:t.despesa, anterior:tAnt.despesa, cor:'var(--brand)' },
    { nome:'Resultado', atual:resultado, anterior:resultadoAnt, cor: resultado>=0 ? 'var(--ok)' : 'var(--bad)' }
  ];
  const max = Math.max(...categorias.map(c => Math.max(Math.abs(c.atual), Math.abs(c.anterior))), 1);
  return `<div class="cmp-wrap">
    <div class="cmp-legend"><span><i style="background:var(--ink2);opacity:.45"></i>${esc(mesLabel(mesCmp()))}</span><span><i style="background:var(--brand)"></i>${esc(mesLabel(state.competencia))}</span></div>
    ${categorias.map(c => `
    <div class="cmp-row">
      <div class="cmp-label">${c.nome}</div>
      <div class="cmp-bars">
        <div class="cmp-bar"><div class="cmp-bar-fill cmp-bar-ant" data-mk="cmpb-${c.nome}" style="width:${Math.max(2, Math.abs(c.anterior)/max*100)}%"></div></div>
        <div class="cmp-bar"><div class="cmp-bar-fill" style="width:${Math.max(2, Math.abs(c.atual)/max*100)}%;background:${c.cor}"></div></div>
      </div>
      <div class="cmp-vals"><span class="cmp-ant" data-mk="cmpv-${c.nome}" ${numAttr(c.anterior)}>${brl(c.anterior)}</span><span class="cmp-atual" style="color:${c.cor}">${brl(c.atual)}</span></div>
    </div>`).join('')}
  </div>`;
}

function viewPizzaComposicao(t, resultado){
  if (!t.receita) return `<p class="empty">Sem receita neste mês pra calcular a composição.</p>`;
  const partes = [
    { nome:'Custo', valor: Math.max(0, t.custo), cor:'var(--warn)' },
    { nome:'Despesa', valor: Math.max(0, t.despesa), cor:'var(--brand)' },
    { nome:'Resultado', valor: Math.max(0, resultado), cor:'var(--ok)' }
  ];
  const somaFatias = partes.reduce((s,p) => s + p.valor, 0) || 1;
  let acc = 0;
  const stops = partes.filter(p => p.valor > 0).map(p => {
    const start = (acc / somaFatias) * 360; acc += p.valor;
    const end = (acc / somaFatias) * 360;
    return `${p.cor} ${start}deg ${end}deg`;
  }).join(', ');
  const legenda = partes.map(p => `<div class="pizza-leg"><span class="dot" style="background:${p.cor}"></span>${p.nome} <b>${pct(p.valor/t.receita)}</b><span class="hint">${brl(p.valor)}</span></div>`).join('');
  const prejuizoNota = resultado < 0 ? `<p class="warn-line">Prejuízo no mês: ${brl(resultado)} (não entra na fatia, pois é negativo).</p>` : '';
  return `<div class="pizza-wrap">
    <div class="pizza" style="background:conic-gradient(${stops || 'var(--surface2) 0deg 360deg'})"></div>
    <div class="pizza-legend">${legenda}</div>
  </div>${prejuizoNota}`;
}

function metaConta(tipo, base){
  if (!state.config || tipo === 'outros' || base === 0) return null;
  if (tipo === 'receita') return base * (1 + Number(state.config.crescimento_receita_pct)/100);
  if (tipo === 'custo') return base * (1 - Number(state.config.reducao_custo_pct)/100);
  return base * (1 - Number(state.config.reducao_despesa_pct)/100);
}
function metaOk(tipo, meta, real){
  return tipo === 'receita' ? real >= meta : real <= meta;
}
function contasEmAlerta(limite){
  return state.contas.filter(c => c.tipo === 'custo' || c.tipo === 'despesa').map(c => {
    const real = state.lanc[c.codigo] || 0;
    const ant = state.lancAnt[c.codigo] || 0;
    const meta = metaConta(c.tipo, ant);
    if (meta === null || meta === 0) return null;
    if (metaOk(c.tipo, meta, real)) return null;
    return { codigo:c.codigo, nome:c.nome, tipo:c.tipo, real, meta, diff: real - meta, pctMeta: real / meta };
  }).filter(Boolean).sort((a,b) => Math.abs(b.diff) - Math.abs(a.diff)).slice(0, limite || 10);
}

function pillMeta(tipo, real, meta){
  if (meta === null || !meta) return '<span class="pm mute">—</span>';
  const ok = metaOk(tipo, meta, real);
  return `<span class="pm ${ok ? 'good' : 'bad'}">${pct(real / meta)}</span>`;
}
function difMeta(tipo, real, meta){
  if (meta === null) return '<span class="dif mute">—</span>';

function bindNavTabelaDre(){
  const box = $('#dreScroll'); if (!box) return;
  const w = box.querySelector('.dre-wrap');
  const suave = reduzMovimento() ? 'auto' : 'smooth';
  box.querySelectorAll('.tn-b').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const acao = b.dataset.tn;
    if (acao === 'esq' || acao === 'dir') {
      const col = w.querySelector('th.th-ant');
      const passo = (col ? col.getBoundingClientRect().width : 120) * 2;
      w.scrollBy({ left: (acao === 'esq' ? -1 : 1) * passo, behavior: suave });
      return;
    }
    const rolaDentro = w.scrollHeight > w.clientHeight + 2;
    if (acao === 'baixo') {
      const alvo = w.querySelector('tr.rs-tit');
      if (!alvo) return;
      if (rolaDentro) {
        const topoWrap = w.getBoundingClientRect().top + window.scrollY;
        window.scrollTo({ top: topoWrap - 8, behavior: suave });
        const cab = w.querySelector('thead');
        w.scrollTo({ top: alvo.offsetTop - (cab ? cab.offsetHeight : 0), behavior: suave });
      } else {
        alvo.scrollIntoView({ block: 'start', behavior: suave });
      }
    } else if (acao === 'cima') {
      w.scrollTo({ top: 0, behavior: suave });
      const cards = document.querySelector('.dchips');
      const y = cards ? cards.getBoundingClientRect().top + window.scrollY - 12 : 0;
      window.scrollTo({ top: Math.max(0, y), behavior: suave });
    }
  });
}

function bindDreScroll(){
  const box = $('#dreScroll'); if (!box || !box.classList.contains('multi')) return;
  const w = box.querySelector('.dre-wrap');
  const setas = box.querySelectorAll('.dn-seta');
  const atualizar = () => {
    const max = w.scrollWidth - w.clientWidth;
    box.classList.toggle('rolou', w.scrollLeft > 2);
    box.classList.toggle('tem-dir', w.scrollLeft < max - 2);
    box.classList.toggle('cabe', max <= 2);
    if (setas[0]) setas[0].disabled = w.scrollLeft <= 2;
    if (setas[1]) setas[1].disabled = w.scrollLeft >= max - 2;
    box.querySelectorAll('.tn-b[data-tn="esq"]').forEach(b => b.disabled = w.scrollLeft <= 2);
    box.querySelectorAll('.tn-b[data-tn="dir"]').forEach(b => b.disabled = w.scrollLeft >= max - 2);
  };
  // abre mostrando o mês atual (à direita); os meses mais antigos ficam à esquerda
  if (state.dreScrollX == null) {
    // computador: encosta à direita (mês atual + os meses que couberem)
    // celular: deixa a coluna "Realizado" logo depois do nome da conta; os meses ficam à esquerda
    const real = w.querySelector('th.th-real'), primeira = w.querySelector('thead th');
    w.scrollLeft = window.innerWidth <= 720 && real && primeira ? real.offsetLeft - primeira.offsetWidth : w.scrollWidth;
  }
  else w.scrollLeft = state.dreScrollX;
  w.addEventListener('scroll', () => { state.dreScrollX = w.scrollLeft; atualizar(); }, { passive:true });
  setas.forEach(b => b.onclick = () => {
    const col = w.querySelector('th.th-ant');
    const passo = (col ? col.getBoundingClientRect().width : 120) * 2;
    w.scrollBy({ left: Number(b.dataset.dir) * passo, behavior: reduzMovimento() ? 'auto' : 'smooth' });
  });
  atualizar();
  window.addEventListener('resize', atualizar, { passive:true });
}

/* ---------- DRE: gráfico de evolução do ano (barras agrupadas) ---------- */
function viewEvolucaoAno(){
  const ano = state.competencia.slice(0, 4);
  const meses = [];
  for (let m = 1; m <= 12; m++) {
    const c = `${ano}-${String(m).padStart(2, '0')}`;
    if (c > state.competencia) break;
    if (state.hist[c] && Object.keys(state.hist[c]).length) meses.push(c);
  }
  if (!meses.length) return '';
  const dados = meses.map(c => { const t = totaisPorTipo(state.hist[c]); return { c, rec:t.receita, cus:t.custo, des:t.despesa, res:t.receita - t.custo - t.despesa }; });
  const series = [['rec', 'Receita'], ['cus', 'Custo'], ['des', 'Despesa']];
  const maxV = Math.max(1, ...dados.flatMap(d => [d.rec, d.cus, d.des]));
  // escala "redonda"
  const passoBruto = maxV / 4, mag = Math.pow(10, Math.floor(Math.log10(passoBruto)));
  const passo = [1, 2, 2.5, 5, 10].map(k => k * mag).find(p => p >= passoBruto);
  const topo = passo * Math.ceil(maxV / passo);
  const n = dados.length, pl = 66, pr = 10, pt = 14, pb = 58, H = 300;
  const larguraTela = window.innerWidth <= 720 ? window.innerWidth - 58 : Math.min(window.innerWidth - 300, 1160);
  const W = Math.max(pl + pr + n * 84, Math.round(larguraTela));
  const gw = (W - pl - pr) / n;
  const y = v => pt + (H - pt - pb) * (1 - v / topo);
  const bw = Math.max(14, Math.min(34, gw * 0.22)), gap = 2, grupo = 3 * bw + 2 * gap;
  const compacto = v => v >= 1000 ? 'R$ ' + (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: v >= 10000 ? 0 : 1 }) + ' mil' : 'R$ ' + Math.round(v);
  let svg = '';
  for (let v = 0; v <= topo + 1; v += passo) {
    svg += `<line class="ev-grid${v === 0 ? ' base' : ''}" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ev-eixo" x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${compacto(v)}</text>`;
  }
  const barra = (x, v, cls) => {
    if (v <= 0) return '';
    const yt = y(v), yb = y(0), r = Math.min(4, (yb - yt));
    return `<path class="ev-b ${cls}" d="M${x},${yb} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + bw - r} Q${x + bw},${yt} ${x + bw},${yt + r} V${yb} Z"/>`;
  };
  dados.forEach((d, i) => {
    const cx = pl + i * gw + gw / 2, x0 = cx - grupo / 2;
    const parcial = d.c === mesAtualReal();
    svg += `<g class="ev-g" data-i="${i}">
      <rect class="ev-hit" x="${pl + i * gw}" y="${pt}" width="${gw}" height="${H - pt - pb + 50}"/>
      ${barra(x0, d.rec, 'rec')}${barra(x0 + bw + gap, d.cus, 'cus')}${barra(x0 + 2 * (bw + gap), d.des, 'des')}
      <text class="ev-mes" x="${cx}" y="${H - pb + 18}" text-anchor="middle">${esc(mesCurto(d.c))}${parcial ? '*' : ''}</text>
      <text class="ev-res ${d.res >= 0 ? 'pos' : 'neg'}" x="${cx}" y="${H - pb + 36}" text-anchor="middle">${d.res >= 0 ? '▲ ' : '▼ '}${compacto(Math.abs(d.res))}</text>
    </g>`;
  });
  const temParcial = meses.includes(mesAtualReal());
  return `<section class="ev-card" id="evoAno">
    <div class="ev-head">
      <div><h3>Evolução de ${ano}</h3><p class="hint">Receita, custo e despesa de cada mês · embaixo, o resultado (▲ lucro · ▼ prejuízo)</p></div>
      <div class="ev-leg">${series.map(([k, n]) => `<span><i class="ev-sw ${k}"></i>${n}</span>`).join('')}</div>
    </div>
    <div class="ev-scroll"><svg class="ev-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="width:${W}px;max-width:none" role="img" aria-label="Gráfico de barras com receita, custo e despesa por mês de ${ano}">${svg}</svg>
      <div class="ev-tip" id="evTip" hidden></div></div>
    ${temParcial ? `<p class="ev-nota">* ${esc(mesCurto(mesAtualReal()))} ainda está em andamento.</p>` : ''}
  </section>`;
}
function bindEvolucaoAno(){
  const card = $('#evoAno'); if (!card) return;
  const tip = $('#evTip'), scroll = card.querySelector('.ev-scroll');
  const ano = state.competencia.slice(0, 4);

  const mostrar = (g, ev) => {
    const d = meses[+g.dataset.i]; if (!d) return;

        <td class="num real ${res >= 0 ? 'pos' : 'neg'}" data-l="Realizado"><b>${brl(res)}</b><small>margem ${pct(margem)}</small></td>
        <td class="num rs-sit" data-l="Situação" colspan="3"><span class="rs-badge ${res >= 0 ? 'pos' : 'neg'}">${res >= 0 ? 'Lucro no mês' : 'Prejuízo no mês'}</span></td></tr>
    </tfoot>
  </table></div>
    ${meses.length > 1 ? '<span class="dre-fade" aria-hidden="true"></span>' : ''}
  </div>
  ${viewEvolucaoAno()}
    <p class="empty dre-vazio" id="dreVazio" hidden>Nenhuma conta encontrada.</p>`;
}


/* ================= DRE DETALHADO (lançamentos de débito: custos e despesas) ================= */
const detCache = {}; // unidade+competencia -> [{codigo_conta,data,nome,descricao,valor,titulo,competencia}]
function fmtData(d){ const [a, m, dd] = String(d).slice(0, 10).split('-'); return `${dd}/${m}`; }
function detMesesEscopo(){
  if (state.detMes === 'todos') return state.histMeses && state.histMeses.length ? state.histMeses : [state.competencia];
  return [state.detMes || state.competencia];
}
function viewDetalhe(){
  return `<div id="detArea">${htmlCarregando()}</div>`;
}
async function carregarDetalhe(){
  const un = state.unidadeId;
  const meses = detMesesEscopo();
  const chave = meses.join(',');
  for (const comp of meses) {
    if (detCache[un + comp]) continue;
    const linhas = [];
    for (let de = 0; ; de += 1000) {
      const { data, error } = await sb.from('fin_lancamentos_det').select('codigo_conta,data,nome,descricao,valor,titulo')
        .eq('unidade_id', un).eq('competencia', comp).order('data').range(de, de + 999);
      if (error) throw error;
      linhas.push(...(data || []));
      if (!data || data.length < 1000) break;
    }
    detCache[un + comp] = linhas.map(l => ({ ...l, valor: Number(l.valor), competencia: comp }));
  }
  if (state.tab !== 'detalhe' || un !== state.unidadeId || detMesesEscopo().join(',') !== chave) return;
  renderDetalhe();
}
function renderDetalhe(){
  const area = $('#detArea'); if (!area) return;
  const meses = detMesesEscopo();
  const multi = meses.length > 1;
  const itens = meses.flatMap(m => detCache[state.unidadeId + m] || []);
  const mAtu = multi ? `Todos os meses (${meses.length})` : capitaliza(mesLabel(meses[0]));
  const opcoesMes = (state.histMeses && state.histMeses.length ? state.histMeses : [state.competencia]).slice().reverse()
    .map(m => `<option value="${m}" ${!multi && meses[0] === m ? 'selected' : ''}>${esc(capitaliza(mesLabel(m)))}</option>`).join('')
    + `<option value="todos" ${multi ? 'selected' : ''}>Todos os meses</option>`;
  const seletorMes = `<select id="detMesSel" class="det-mes-sel" aria-label="Escolher mês do DRE Detalhado">${opcoesMes}</select>`;
  if (!itens.length) {
    area.innerHTML = `<div class="det-acoes"><div class="det-filtros">${seletorMes}</div></div>
    <div class="det-vazio">
      <span class="dv-ico">${NAV_ICONES.detalhe}</span>
      <b>Ainda não há lançamentos detalhados ${multi ? 'em nenhum mês disponível' : `de ${esc(mAtu)}`}</b>
      <p class="hint">Os detalhes (fornecedor, descrição e data) chegam na próxima atualização automática com o Tacto. Pra buscar agora, use <b>Atualizar agora</b> na aba Importar, ou importe o Excel de <b>débito</b> desse mês.</p>
      <button class="btn" type="button" id="detIrImportar">Ir para Importar</button></div>`;
    const b = $('#detIrImportar'); if (b) b.onclick = () => { state.tab = 'importar'; render(); };
    const s = $('#detMesSel'); if (s) s.onchange = async () => { state.detMes = s.value; area.innerHTML = htmlCarregando(); await carregarDetalhe(); };
    return;
  }
  const busca = normName(state.detBusca || '');
  const bate = it => !busca || normName(`${it.nome || ''} ${it.descricao || ''} ${brl(it.valor)} ${fmtData(it.data)}`).includes(busca);
  const porConta = new Map();
  for (const it of itens) {
    const c = porConta.get(it.codigo_conta) || { codigo: it.codigo_conta, itens: [], total: 0 };
    c.itens.push(it); c.total += it.valor; porConta.set(it.codigo_conta, c);
  }
  const info = cod => state.contas.find(c => c.codigo === cod) || { nome: cod, tipo: tipoPorCodigo(cod) };
  const grupos = ['custo', 'despesa', 'outros'].map(tipo => {
    const contas = [...porConta.values()].filter(c => (info(c.codigo).tipo || 'despesa') === tipo)
      .map(c => ({ ...c, nome: info(c.codigo).nome, vis: c.itens.filter(bate) }))
      .filter(c => !busca || c.vis.length || normName(c.nome).includes(busca))
      .sort((a, b) => b.total - a.total);
    return { tipo, contas, total: contas.reduce((s, c) => s + c.total, 0) };
  }).filter(g => g.contas.length);
  const totalGeral = itens.reduce((s, i) => s + i.valor, 0);
  const nForn = new Set(itens.map(i => normName(i.nome || '')).filter(Boolean)).size;
  const abertos = state.detAbertos || (state.detAbertos = new Set());
  const buscando = !!busca;
  // busca em vários meses ao mesmo tempo: mostra o total encontrado com o valor separado por mês
  let resumoBusca = '';
  if (buscando && multi) {
    const porMes = new Map();
    for (const it of itens) {
      if (!bate(it)) continue;
      const m = porMes.get(it.competencia) || { total: 0, n: 0 };
      m.total += it.valor; m.n++; porMes.set(it.competencia, m);
    }
    const totalBusca = [...porMes.values()].reduce((s, m) => s + m.total, 0);
    const nBusca = [...porMes.values()].reduce((s, m) => s + m.n, 0);
    resumoBusca = porMes.size
      ? `<div class="det-resbusca"><div class="drb-tot"><em>${brl(totalBusca)}</em> em ${nBusca} ${nBusca === 1 ? 'lançamento' : 'lançamentos'} pra "${esc(state.detBusca)}"</div>
        <div class="drb-meses">${meses.filter(m => porMes.has(m)).map(m => `<span><b>${brl(porMes.get(m).total)}</b>${esc(capitaliza(mesCurto(m)))} · ${porMes.get(m).n} lanç.</span>`).join('')}</div></div>`
      : '';
  }
  const linhaItem = it => `<tr><td class="dt-d">${esc(fmtData(it.data))}${multi ? `<small>${esc(mesCurto(it.competencia))}</small>` : ''}</td><td class="dt-n">${esc(it.nome || '—')}</td><td class="dt-x">${esc(it.descricao || '—')}${it.titulo ? `<small>Título ${esc(it.titulo)}</small>` : ''}</td><td class="num dt-v">${brl(it.valor)}</td></tr>`;
  area.innerHTML = `
    <div class="det-topo">
      <div><h2>DRE Detalhado · ${esc(mAtu)}</h2><p class="hint">Cada lançamento de custo e despesa (débito) por plano de contas: fornecedor, descrição, data e valor. Escolha um mês específico ou veja todos de uma vez.</p></div>
      <div class="det-kpis"><span><b>${brl(totalGeral)}</b>total lançado</span><span><b>${itens.length.toLocaleString('pt-BR')}</b>lançamentos</span><span><b>${nForn}</b>fornecedores/pessoas</span></div>
    </div>
    <div class="det-acoes">
      <div class="det-filtros">${seletorMes}</div>
      <label class="dre-busca det-busca"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
        <input id="detBusca" type="search" placeholder="Buscar fornecedor, descrição ou valor…" autocomplete="off" value="${esc(state.detBusca || '')}" aria-label="Buscar nos lançamentos"></label>
      <button type="button" class="dre-todos" id="detTodos">${abertos.size ? 'Recolher todos' : 'Abrir todos'}</button>
    </div>
    ${resumoBusca}
    ${grupos.length ? grupos.map(g => `
      <section class="det-grupo t-${g.tipo}">
        <div class="dg-head"><span class="grp-ico">${icone(g.tipo)}</span><b>${NOME_GRUPO[g.tipo]}</b><span class="grp-n">${g.contas.length} ${g.contas.length === 1 ? 'conta' : 'contas'}</span><span class="dg-tot">${brl(g.total)}</span></div>
        ${g.contas.map(c => {
          const aberto = buscando || abertos.has(c.codigo);
          const lista = buscando ? c.vis : c.itens;
          return `<div class="det-conta${aberto ? ' aberta' : ''}" data-dc="${esc(c.codigo)}">
            <button type="button" class="dc-head" aria-expanded="${aberto}">
              <span class="dc-nome"><b>${esc(c.nome)}</b><small>${esc(c.codigo)} · ${c.itens.length} ${c.itens.length === 1 ? 'lançamento' : 'lançamentos'}</small></span>
              <span class="dc-bar"><i style="width:${Math.max(2, g.total ? c.total / g.total * 100 : 0)}%"></i></span>
              <span class="dc-tot">${brl(c.total)}<small>${g.total ? pct(c.total / g.total) : ''} do grupo</small></span>
              <span class="grp-chev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
            </button>
            ${aberto ? `<div class="dc-corpo"><table class="det-tab"><thead><tr><th>Data</th><th>Nome</th><th>Descrição</th><th class="num">Valor</th></tr></thead>
              <tbody>${lista.slice().sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : b.valor - a.valor).map(linhaItem).join('')}</tbody>
              <tfoot><tr><td colspan="3">${buscando && lista.length !== c.itens.length ? `${lista.length} de ${c.itens.length} lançamentos` : 'Total da conta'}</td><td class="num">${brl(lista.reduce((s, i) => s + i.valor, 0))}</td></tr></tfoot></table></div>` : ''}
          </div>`;
        }).join('')}
      </section>`).join('') : `<p class="empty">Nenhum lançamento encontrado pra "${esc(state.detBusca)}".</p>`}`;
  const inp = $('#detBusca');
  if (inp) {
    inp.oninput = () => { state.detBusca = inp.value; const pos = inp.selectionStart; renderDetalhe(); const n = $('#detBusca'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } };
  }
  const selMes = $('#detMesSel');
  if (selMes) selMes.onchange = async () => { state.detMes = selMes.value; area.innerHTML = htmlCarregando(); await carregarDetalhe(); };
  const tod = $('#detTodos');
  if (tod) tod.onclick = () => { if (abertos.size) abertos.clear(); else porConta.forEach((v, k) => abertos.add(k)); renderDetalhe(); };
  area.querySelectorAll('.dc-head').forEach(h => h.onclick = () => {
    const cod = h.parentElement.dataset.dc;
    if (abertos.has(cod)) abertos.delete(cod); else abertos.add(cod);
    renderDetalhe();
  });
  if (state.detFoco) {
    const alvo = area.querySelector(`[data-dc="${CSS.escape(state.detFoco)}"]`);
    state.detFoco = null;
    if (alvo) alvo.scrollIntoView({ block: 'start', behavior: reduzMovimento() ? 'auto' : 'smooth' });
  }
}
function abrirDetalheConta(codigo){
  state.detAbertos = state.detAbertos || new Set();
  state.detAbertos.add(codigo);
  state.detFoco = codigo;
  state.detBusca = '';
  state.detMes = state.competencia;
  state.tab = 'detalhe';

/* ================= METAS ================= */
function viewMetas(t){
  const cfg = state.config || {};
  const n = (campo, padrao) => cfg[campo] == null ? padrao : Number(cfg[campo]);
  const mAnt = MESES[+state.competenciaAnterior.split('-')[1] - 1];
  const mAtu = MESES[+state.competencia.split('-')[1] - 1];
  let topo;
  if (cfg.metas_ativas) {
    const tAnt = totaisPorTipo(state.lancAnt);
    const itens = [
      { key:'receita', pctMeta: n('crescimento_receita_pct',10), verbo:'crescer' },
      { key:'custo', pctMeta: n('reducao_custo_pct',10), verbo:'reduzir' },
      { key:'despesa', pctMeta: n('reducao_despesa_pct',10), verbo:'reduzir' }
    ];
    const batidas = itens.filter(i => { const m = metaConta(i.key, tAnt[i.key]); return m !== null && metaOk(i.key, m, t[i.key]); }).length;
    topo = `<div class="msum"><b>${batidas} de 3</b> metas batidas em ${mAtu}<span>· base de comparação: ${mAnt}</span></div>
    <div class="mcards">${itens.map(i => {
      const atual = t[i.key], ant = tAnt[i.key];
      const meta = metaConta(i.key, ant);
      const variacao = ant ? (atual - ant) / ant : 0;
      const ok = meta !== null && metaOk(i.key, meta, atual);
      const p = meta ? atual / meta : 0;
      const status = meta === null ? 'sem base no mês anterior'
        : ok ? (i.key === 'receita' ? 'Meta batida' : 'Dentro da meta')
        : (i.key === 'receita' ? `Faltam ${brl(meta - atual)}` : `Passou ${brl(atual - meta)}`);
      return `<div class="rcard mcard t-${i.key}">
        <div class="rc-head"><span class="rc-ico">${icone(i.key)}</span><span class="rc-nome">${NOME_TIPO[i.key]}</span>
          <span class="mc-alvo">meta: ${i.verbo} ${i.pctMeta.toLocaleString('pt-BR')}%</span></div>
        <div class="mc-var ${ok ? 'good' : 'bad'}">${variacao >= 0 ? '+' : ''}${pct(variacao)}<small>vs ${mAnt}</small></div>
        <div class="mc-cmp"><div><span>${capitaliza(mAnt)}</span><b>${brl(ant)}</b></div><div><span>${capitaliza(mAtu)}</span><b>${brl(atual)}</b></div><div><span>Meta</span><b>${meta === null ? '—' : brl(meta)}</b></div></div>
        <div class="rc-bar"><i class="${ok ? 'good' : 'bad'}" style="width:${Math.min(100, p * 100)}%"></i></div>
        <div class="mc-foot"><span class="mc-status ${ok ? 'good' : 'bad'}">${ok ? '✓ ' : ''}${status}</span><span>${meta ? pct(p) + ' da meta' : ''}</span></div>
      </div>`;
    }).join('')}</div>`;
  } else {
    topo = `<p class="empty">Metas desligadas. Ligue abaixo pra acompanhar metas e alertas.</p>`;
  }
  const campo = (id, label, valor, dica, tipo) => `<div class="mf t-${tipo}"><label for="${id}"><i class="dot"></i>${label}</label>
    <div class="mf-in"><input id="${id}" type="number" step="0.5" min="0" max="100" value="${valor}"><span>%</span></div><small>${dica}</small></div>`;
  const form = `<form class="metaform2" id="metasForm">
    <div class="mf-head">
      <div><h3>Configurar metas</h3><p class="hint">As metas de cada mês são calculadas em cima do realizado do mês anterior.</p></div>
      <label class="toggle"><input type="checkbox" id="mAtiva" ${cfg.metas_ativas ? 'checked' : ''}><span class="tg"></span>Acompanhar metas e alertas</label>
    </div>
    <div class="mf-cols">
      <fieldset><legend>Metas mensais</legend>
        ${campo('mRec', 'Crescer receita', n('crescimento_receita_pct',10), 'Ex.: 10 = vender 10% a mais que o mês passado', 'receita')}
        ${campo('mCus', 'Reduzir custo', n('reducao_custo_pct',10), 'Vale pra cada conta de custo', 'custo')}
        ${campo('mDes', 'Reduzir despesa', n('reducao_despesa_pct',10), 'Vale pra cada conta de despesa', 'despesa')}
      </fieldset>
      <fieldset><legend>Faixas saudáveis dos indicadores</legend>
        ${campo('mCmv', 'CMV máximo', n('cmv_max_pct',35), 'Custo ÷ receita', 'custo')}
        ${campo('mFolha', 'Folha máxima', n('folha_max_pct',25), 'Pessoal ÷ receita', 'despesa')}
        ${campo('mMargem', 'Margem mínima', n('margem_min_pct',10), 'Resultado ÷ receita', 'resultado')}
      </fieldset>
    </div>
    <div class="metaform-foot"><button class="btn" type="submit">Salvar metas</button></div>
  </form>`;
  return topo + form;
}

/* ================= ALERTAS ================= */
function viewAlertas(t){
  if (!state.config || !state.config.metas_ativas) return `<p class="empty">Metas desligadas — sem alertas pra mostrar.</p>`;
  const agreg = alertasAtuais(t);
  const contas = contasEmAlerta(100);
  const mAtu = MESES[+state.competencia.split('-')[1] - 1];
  if (!agreg.length && !contas.length) return `<div class="aok"><span class="rc-ico">${icone('receita')}</span><div><b>Nenhum alerta em ${mAtu}</b><p class="hint">Custos e despesas estão dentro das metas.</p></div></div>`;
  const excesso = contas.reduce((s, c) => s + c.diff, 0);
  const tAnt = totaisPorTipo(state.lancAnt);
  const banner = `<div class="abanner">
    <span class="ab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5v.01"/></svg></span>
    <div><b>${contas.length} ${contas.length === 1 ? 'conta passou' : 'contas passaram'} da meta em ${mAtu}</b>
    <p>Somando, são <strong>${brl(excesso)}</strong> acima do previsto.</p></div></div>`;
  const cardsAgreg = agreg.length ? `<div class="agcards">${agreg.map(a => {
    const meta = metaConta(a.key, tAnt[a.key]);
    const real = t[a.key];
    return `<div class="rcard agcard t-${a.key}"><div class="rc-head"><span class="rc-ico">${icone(a.key)}</span><span class="rc-nome">${NOME_TIPO[a.key]} total acima da meta</span></div>
      <div class="ag-nums"><div><span>Realizado</span><b class="bad">${brl(real)}</b></div><div><span>Meta</span><b>${meta === null ? '—' : brl(meta)}</b></div><div><span>Passou</span><b class="bad">${meta === null ? '—' : '+' + brl(real - meta)}</b></div></div></div>`;
  }).join('')}</div>` : '';
  const bloco = tipo => {
    const lista = contas.filter(c => c.tipo === tipo);
    if (!lista.length) return '';
    const soma = lista.reduce((s, c) => s + c.diff, 0);
    return `<section class="ablock t-${tipo}">
      <div class="ablock-head"><span class="rc-ico">${icone(tipo)}</span><h3>${NOME_GRUPO[tipo]}</h3><span class="ablock-n">${lista.length} ${lista.length === 1 ? 'conta' : 'contas'} · +${brl(soma)}</span></div>
      ${lista.map(c => {
        const okW = Math.max(4, Math.min(100, c.meta / c.real * 100));
        return `<div class="arow clk-row" data-cod="${esc(c.codigo)}">
          <div class="arow-top"><b class="arow-nome">${esc(c.nome)}</b><span class="arow-exc">+${brl(c.diff)}</span></div>
          <div class="abar"><i class="ok" style="width:${okW}%"></i><i class="over" style="width:${100 - okW}%"></i></div>
          <div class="arow-bot"><span>Meta <b class="c-meta">${brl(c.meta)}</b></span><span>Realizado <b class="c-real">${brl(c.real)}</b></span><span class="arow-pct">${pct(c.pctMeta)} da meta</span></div>
        </div>`;
      }).join('')}
    </section>`;
  };
  return banner + cardsAgreg + `<div class="ablocks">${bloco('custo')}${bloco('despesa')}</div>`;
}

// Dicas calculadas a partir dos números do mês selecionado.
function dicasDosNumeros(t, resultado){
  const out = [];
  const mAtu = MESES[+state.competencia.split('-')[1] - 1];
  const mAnt = MESES[+state.competenciaAnterior.split('-')[1] - 1];
  if (state.competencia === mesAtualReal()) {
    out.push({ cat:'gestao', pra:'Gestor', imp:'Alto', tit:`${capitaliza(mAtu)} ainda está em aberto`,
      txt:`Os números de ${mAtu} são parciais: contas como salários só entram quando o mês fecha. Use os alertas com cuidado e reimporte o PDF completo no fim do mês.` });
  }
  if (!t.receita) return out;
  const cmv = t.custo / t.receita, cmvMax = cfgNum('cmv_max_pct', 35) / 100;
  if (cmv > cmvMax) {
    out.push({ cat:'custos', pra:'Gestor', imp:'Alto', tit:`CMV em ${pct(cmv)}, acima do ideal`,
      txt:`Os custos de mercadoria estão consumindo ${pct(cmv)} da receita (ideal até ${pct(cmvMax)}). Revise o porcionamento do buffet livre e o preço do PF e do marmitex.` });
  }
  const topCusto = topContas('custo', 1)[0];
  if (topCusto && topCusto.pctDoTotal >= 0.25) {
    out.push({ cat:'custos', pra:'Gestor', imp:'Alto', tit:`${capitaliza(topCusto.nome.toLowerCase())} pesa ${pct(topCusto.pctDoTotal)} dos custos`,
      txt:`Foi ${brl(topCusto.valor)} em ${mAtu}. Por ser o maior custo, qualquer 5% economizado aqui (cotação, corte, porção) aparece direto no resultado: cerca de ${brl(topCusto.valor * 0.05)} por mês.` });
  }
  const altas = contasCresceram(50).filter(c => c.tipo !== 'receita' && c.atual - c.anterior >= 300);
  if (altas.length) {
    const a = altas.sort((x, y) => (y.atual - y.anterior) - (x.atual - x.anterior))[0];
    out.push({ cat:'custos', pra:'Gestor', imp:'Alto', tit:`${capitaliza(a.nome.toLowerCase())} subiu ${pct(a.variacao)}`,
      txt:`Passou de ${brl(a.anterior)} em ${mAnt} pra ${brl(a.atual)} em ${mAtu} (+${brl(a.atual - a.anterior)}). Vale entender o motivo: reajuste, consumo maior ou lançamento fora do mês.` });
  }
  const receitas = state.contas.filter(c => c.tipo === 'receita');
  const refeicoes = receitas.filter(c => normName(c.nome).includes('REFEIC')).reduce((s, c) => s + (state.lanc[c.codigo] || 0), 0);
  if (refeicoes && refeicoes / t.receita >= 0.55) {
    out.push({ cat:'vendas', pra:'Equipe', imp:'Médio', tit:`Refeições são ${pct(refeicoes / t.receita)} da receita`,
      txt:`O resto vem de bebidas, conveniência e lanches. Cada caminhoneiro que almoça é uma chance de vender água, café, sobremesa ou marmitex pra viagem: treine a equipe do caixa pra oferecer.` });
  }
  const folha = folhaDe(state.lanc) / t.receita, folhaMax = cfgNum('folha_max_pct', 25) / 100;
  if (folha > folhaMax) {
    out.push({ cat:'operacao', pra:'Gestor', imp:'Alto', tit:`Folha em ${pct(folha)} da receita`,
      txt:`Está acima do ideal de ${pct(folhaMax)}. Compare a escala com os horários de maior movimento e veja se há hora extra ou diarista em horário parado.` });
  }
  if (resultado < 0) {
    out.push({ cat:'gestao', pra:'Gestor', imp:'Alto', tit:'Mês com prejuízo',
      txt:`O resultado de ${mAtu} está em ${brl(resultado)}. Priorize os 3 maiores custos e despesas da aba DRE antes de qualquer outro corte.` });
  }
  return out;
}

/* ================= MARGEM POR PRODUTO ================= */
const MG_STOP = new Set(['VENDAS','VENDA','CUSTO','CUSTOS','P','DE','DA','DO','E','PARA','PRA']);
function mgTokens(nome){
  return normName(nome).split(' ').filter(w => w && !MG_STOP.has(w))
    .map(w => w.length > 3 && w.endsWith('S') ? w.slice(0, -1) : w);
}
function mgScore(a, b){
  const A = new Set(a), B = new Set(b);
  let n = 0; A.forEach(x => { if (B.has(x)) n++; });
  return n / Math.max(A.size, B.size, 1);
}
// Cada receita "VENDAS X" recebe os custos "CUSTO X" com nome parecido.
// Os custos da cozinha (grupo 2.1: carnes, frango, horti etc.) vão todos pra linha de Refeições.
function montarLinhasMargem(contas){
  const receitas = contas.filter(c => c.tipo === 'receita');
  const custos = contas.filter(c => c.tipo === 'custo');
  const linhas = new Map(receitas.map(r => [r.codigo, { receita:r, custos:[], tokens:mgTokens(r.nome) }]));
  const refeicao = receitas.find(r => normName(r.nome).includes('REFEIC'));
  const semPar = [];
  for (const c of custos) {
    if (refeicao && (c.pai_codigo === '2.1' || String(c.codigo).startsWith('2.1.'))) { linhas.get(refeicao.codigo).custos.push(c); continue; }
    const tk = mgTokens(c.nome);
    let melhor = null, nota = 0;
    for (const l of linhas.values()) { const s = mgScore(tk, l.tokens); if (s > nota) { nota = s; melhor = l; } }
    if (melhor && nota >= 0.5) melhor.custos.push(c); else semPar.push(c);
  }
  return { linhas: [...linhas.values()], semPar };
}
function nomeLinha(nome){ return capitaliza(String(nome).replace(/^VENDAS?\s+/i, '').toLowerCase()); }

function viewMargens(){

    const venda = state.lanc[l.receita.codigo] || 0, custo = soma(l.custos, state.lanc);
    const vAnt = state.lancAnt[l.receita.codigo] || 0, cAnt = soma(l.custos, state.lancAnt);
    return { cod:l.receita.codigo, nome:nomeLinha(l.receita.nome), venda, custo, margem: venda - custo,
      pct: venda ? (venda - custo) / venda : null, pctAnt: vAnt ? (vAnt - cAnt) / vAnt : null, nCustos:l.custos.length };
  }).filter(d => d.venda || d.custo).sort((a, b) => b.margem - a.margem);
  if (!dados.length) return `<p class="empty">Sem vendas nem custos lançados em ${mAtu}.</p>`;

    <div class="dchip t-resultado pos"><span class="dchip-ico">${icone('resultado')}</span><div><span class="dchip-lbl">Margem bruta</span><b ${numAttr(tv - tc)}>${brl(tv - tc)}</b><span class="dchip-sub">${tv ? pct((tv - tc) / tv) : '—'} das vendas</span></div></div>
    <div class="dchip t-despesa"><span class="dchip-ico">${icone('despesa')}</span><div><span class="dchip-lbl">Mais lucrativa</span><b>${topo ? esc(topo.nome) : '—'}</b><span class="dchip-sub">${topo ? brl(topo.margem) + ' de margem (' + pct(topo.pct) + ')' : ''}</span></div></div>
  </div>

  <div class="mg-list">
    <div class="mg-row mg-th"><span>Linha</span><span class="num">Venda</span><span class="num">Custo</span><span class="num">Margem</span><span class="num">%</span></div>
    ${dados.map(d => {

      let delta = '';
      if (d.pct !== null && d.pctAnt !== null && d.custo > 0) {

        if (Math.abs(pp) >= 0.5) delta = `<small class="${pp > 0 ? 'good' : 'bad'}">${pp > 0 ? '▲' : '▼'} ${Math.abs(pp).toLocaleString('pt-BR', { maximumFractionDigits:0 })} pts<span class="mg-vs"> vs ${mAnt}</span></small>`;
      }
      const wv = d.venda / maxV * 100, wc = Math.min(d.custo, d.venda) / maxV * 100, wx = Math.max(0, d.custo - d.venda) / maxV * 100;
      return `<div class="mg-row clk-row" data-cod="${esc(d.cod)}">

      </div>`;
    }).join('')}
  </div>
  <div class="mg-leg"><span><i class="c"></i>custo</span><span><i class="m"></i>margem</span><span><i class="x"></i>custo acima da venda</span>

}

/* ================= PROJEÇÃO DO MÊS ================= */
function ehDespVariavel(c){
  const n = normName(c.nome);
  return (String(c.codigo).startsWith('3.2.') && !n.includes('IPTU')) || String(c.codigo).startsWith('3.7.') || n.includes('COMISS');
}
function projecaoMes(t){
  if (state.competencia !== mesAtualReal()) return null;
  const [a, m] = state.competencia.split('-').map(Number);
  const diasMes = new Date(a, m, 0).getDate();
  let corte = new Date();
  if (state.ultimaImport) { const d = new Date(state.ultimaImport); if (d.getFullYear() === a && d.getMonth() + 1 === m) corte = d; }
  const dias = corte.getDate();
  if (!t.receita || dias >= diasMes) return null;
  const fator = diasMes / dias;
  let despesa = 0;
  for (const c of state.contas.filter(c => c.tipo === 'despesa')) {
    const atual = state.lanc[c.codigo] || 0, ant = state.lancAnt[c.codigo] || 0;
    despesa += ehDespVariavel(c) ? atual * fator : Math.max(atual, ant);
  }
  const receita = t.receita * fator, custo = t.custo * fator;
  return { dias, diasMes, receita, custo, despesa, resultado: receita - custo - despesa,
    metaRec: metaConta('receita', totaisPorTipo(state.lancAnt).receita) };
}
function viewProjecao(t){
  const p = projecaoMes(t);
  if (!p) return '';
  const mAtu = MESES[+state.competencia.split('-')[1] - 1];
  const pos = p.resultado >= 0;
  const metaTxt = p.metaRec ? `<span class="pj-meta ${p.receita >= p.metaRec ? 'good' : 'bad'}">receita prevista = ${pct(p.receita / p.metaRec)} da meta</span>` : '';
  return `<section class="pj">
    <div class="pj-head">
      <div><h3>Projeção de ${mAtu}</h3><p class="hint">Dados até o dia ${p.dias} de ${p.diasMes} · estimativa se o ritmo continuar igual</p></div>
      ${metaTxt}
    </div>
    <div class="pj-dias"><i style="width:${p.dias / p.diasMes * 100}%"></i></div>
    <div class="pj-nums">
      <div class="t-receita"><span>Receita prevista</span><b ${numAttr(p.receita)}>${brl(p.receita)}</b></div>
      <div class="t-custo"><span>Custo previsto</span><b ${numAttr(p.custo)}>${brl(p.custo)}</b></div>
      <div class="t-despesa"><span>Despesas estimadas</span><b ${numAttr(p.despesa)}>${brl(p.despesa)}</b></div>
      <div class="t-resultado ${pos ? 'pos' : 'neg'}"><span>Resultado previsto</span><b ${numAttr(p.resultado)}>${brl(p.resultado)}</b></div>
    </div>
    <p class="pj-nota">Receita e custo seguem a média por dia até agora. Nas despesas fixas (aluguel, salários etc.) usamos o maior valor entre o que já foi lançado e o do mês anterior; impostos, taxas e comissões acompanham as vendas.</p>
  </section>`;
}

/* ================= PONTO DE EQUILÍBRIO ================= */
function pontoEquilibrio(t){
  const aberto = state.competencia === mesAtualReal();
  const usarAnt = aberto && Object.keys(state.lancAnt).length > 0;
  const mapa = usarAnt ? state.lancAnt : state.lanc;
  const tot = usarAnt ? totaisPorTipo(state.lancAnt) : t;
  if (!tot.receita) return null;
  let desVar = 0, desFix = 0;
  for (const c of state.contas.filter(c => c.tipo === 'despesa')) {
    const v = mapa[c.codigo] || 0;
    if (ehDespVariavel(c)) desVar += v; else desFix += v;
  }
  const mc = (tot.receita - tot.custo - desVar) / tot.receita;
  if (mc <= 0) return { invalido:true };
  const [a, m] = state.competencia.split('-').map(Number);
  const diasMes = new Date(a, m, 0).getDate();
  const pe = desFix / mc;
  const proj = aberto ? projecaoMes(t) : null;
  const referencia = proj ? proj.receita : t.receita;
  return { pe, porDia: pe / diasMes, mc, desFix, base: usarAnt ? state.competenciaAnterior : state.competencia, referencia, porProjecao: !!proj };
}
function kpiPontoEquilibrio(t){
  const r = pontoEquilibrio(t);
  if (!r) return '';
  if (r.invalido) return `<div class="kpi bad"><span class="kpi-label">Ponto de equilíbrio</span><span class="kpi-val">—</span><span class="kpi-ref">custos variáveis maiores que a receita</span></div>`;
  const ok = r.referencia >= r.pe;
  const dif = r.referencia / r.pe - 1;
  const mil = v => 'R$ ' + (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits:1 }) + ' mil';
  const baseTxt = r.base !== state.competencia ? ` · base: ${MESES[+r.base.split('-')[1] - 1]}` : '';
  // barra: quanto já vendeu, até onde a projeção leva e onde fica o equilíbrio
  const vendido = t.receita || 0;
  const escala = Math.max(r.pe, r.referencia, vendido) * 1.08 || 1;
  const pv = Math.min(100, vendido / escala * 100), pp = Math.min(100, r.referencia / escala * 100), pm = r.pe / escala * 100;
  const passou = vendido >= r.pe;
  const faltaPct = r.pe ? Math.max(0, 1 - vendido / r.pe) : 0;
  const cel = passou ? ` data-pecel="${esc(state.unidadeId + '_' + state.competencia)}"` : '';
  return `<div class="kpi kpi-pe ${ok ? 'good' : 'bad'}${passou ? ' pe-passou' : ''}"${cel} title="Despesas fixas ÷ margem de contribuição (${pct(r.mc)})">
    <span class="kpi-label">Ponto de equilíbrio</span>
    <span class="kpi-val">${mil(r.pe)}</span>
    <span class="kpi-ref">${brl(r.porDia)} por dia${baseTxt}</span>
    <div class="pe-bar" aria-label="Vendido ${pct(vendido / (r.pe || 1))} do ponto de equilíbrio">
      ${r.porProjecao ? `<i class="pe-proj" style="width:${pp}%"></i>` : ''}
      <i class="pe-fill" style="width:${pv}%"></i>
      <b class="pe-marca" style="left:${pm}%"><span>equilíbrio</span></b>
    </div>
    <span class="pe-leg">${passou ? '<strong class="c-ok">passou do equilíbrio ✓</strong>' : `vendido: <strong>${pct(vendido / (r.pe || 1))}</strong> · falta ${pct(faltaPct)}`}</span>
    <span class="kpi-var">${r.porProjecao ? 'projeção' : 'receita do mês'}: ${mil(r.referencia)} (${dif >= 0 ? '+' : ''}${pct(dif)})</span>
  </div>`;
}

/* ================= Importar contas (PDF Tacto) =================
   Fora do artefato dá pra usar pdf.js de verdade (CDN) em vez do parser
   nativo de bytes que o artefato precisava por causa da sandbox. A partir
   daqui reaproveita exatamente a lógica original de leitura das linhas do
   relatório (parseAccountLine / dropSubtotalRows / detectCompetencia). */

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
}

const MONTH_NAME_TO_NUM = { JANEIRO:'01', FEVEREIRO:'02', MARCO:'03', ABRIL:'04', MAIO:'05', JUNHO:'06', JULHO:'07', AGOSTO:'08', SETEMBRO:'09', OUTUBRO:'10', NOVEMBRO:'11', DEZEMBRO:'12' };
const TIPOS = [['receita','Receitas'], ['custo','Custos'], ['despesa','Despesas'], ['outros','Outros']];
let imp = null;

function normName(s){
  return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
}

function parseAccountLine(line){
  const tokens = line.split(' ').filter(Boolean);
  if (tokens.length < 6) return null;
  const pctTok = tokens[tokens.length-1];
  if (!/%$/.test(pctTok)) return null;
  const valTok = tokens[tokens.length-2];
  const signTok = tokens[tokens.length-3];
  if (!/^-?R\$$/.test(signTok)) return null;
  const levelTok = tokens[tokens.length-4];
  if (!/^\d+$/.test(levelTok)) return null;
  if (levelTok === '0') return null; // total do grupo (RECEITA / CUSTOS TOTAIS / DESPESAS TOTAIS)
  const code = tokens[1];
  const nameTokens = tokens.slice(2, tokens.length-4);
  if (!nameTokens.length) return null;
  let nameRaw = nameTokens.join(' ');
  if (nameRaw.indexOf('*') !== -1) return null; // subtotal de departamento, não é conta-folha
  const name = nameRaw.replace(/^>+/, '').trim();
  if (!name) return null;
  const numStr = valTok.replace(/\./g,'').replace(',', '.');
  const value = Math.abs(parseFloat(numStr));
  if (isNaN(value)) return null;
  return {name, value, code, nivel: parseInt(levelTok, 10)};
}

function dropSubtotalRows(rows){
  const codes = rows.map(r=>r.code).filter(Boolean);
  return rows.filter(r=>{
    if (!r.code) return true;
    return !codes.some(c => c !== r.code && c.indexOf(r.code + '.') === 0);
  });
}

function detectCompetencia(texto){
  const m = texto.match(/\b(\d{4})\s*-\s*([A-ZÇÃÕÁÉÍÓÚ]+)/i);
  if (!m) return null;
  const mm = MONTH_NAME_TO_NUM[normName(m[2])];
  return mm ? m[1] + '-' + mm : null;
}

function rowsFromReportLines(lines){
  let rows = [];
  lines.forEach(line => { const p = parseAccountLine(line); if (p) rows.push(p); });
  rows = dropSubtotalRows(rows);
  return { rows, competencia: detectCompetencia(lines.join(' ')) };
}

// Agrupa itens de texto do pdf.js em linhas (mesma ideia do artefato: tolerância
// vertical proporcional ao tamanho da fonte, espaço decidido pelo vão horizontal).
function itemsToLines(items){
  const valid = items.filter(it => it.str && it.str.length);
  if (!valid.length) return [];
  const sorted = valid.slice().sort((a, b) => (b.y - a.y) || (a.x - b.x));
  const rows = [];
  sorted.forEach(it => {
    const last = rows[rows.length - 1];
    const tol = Math.max(1.5, 0.4 * (it.size || 10));
    if (last && Math.abs(last.y - it.y) <= tol) last.items.push(it);
    else rows.push({ y: it.y, items: [it] });
  });
  return rows.map(row => {
    const its = row.items.slice().sort((a, b) => a.x - b.x);
    let line = '';
    let prevEnd = null;
    its.forEach(it => {
      const gap = prevEnd === null ? 0 : it.x - prevEnd;
      const thr = 0.18 * (it.size || 10);
      if (prevEnd !== null && gap > thr && !/\s$/.test(line) && !/^\s/.test(it.str)) line += ' ';
      line += it.str;
      prevEnd = it.x + (it.w || 0);
    });
    return line.replace(/\s+/g, ' ').trim();
  });
}

async function pdfjsExtractLines(file, aoProgredir){
  if (!window.pdfjsLib) throw new Error('Biblioteca de leitura de PDF não carregou. Verifique sua conexão e tente de novo.');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const allLines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    if (aoProgredir) aoProgredir(p, pdf.numPages);
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items.map(it => ({
      str: it.str,
      x: it.transform[4],
      y: it.transform[5],
      size: Math.hypot(it.transform[2], it.transform[3]) || 10,
      w: it.width || 0
    }));
    itemsToLines(items).forEach(l => { if (l) allLines.push(l); });
  }
  return allLines;
}

const raizCod = c => String(c).split('.')[0];
function adivinharTipos(rows, plano){
  const porCod = new Map(plano.map(c => [c.codigo, c.tipo]));
  const porRaiz = {};
  rows.forEach(r => {
    let t = porCod.get(r.code);
    r.nova = !porCod.has(r.code);
    if (!t) {
      const primeira = normName(r.name).split(' ')[0];
      if (primeira === 'VENDAS') t = 'receita';
      else if (primeira === 'CUSTO' || primeira === 'CUSTOS') t = 'custo';
      else t = porRaiz[raizCod(r.code)] || 'despesa';
    }
    r.tipo = t;
    porRaiz[raizCod(r.code)] = t;
  });
}
