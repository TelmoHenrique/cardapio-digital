<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Viéstec Gestor</title>
<meta name="description" content="DRE, metas, margens e alertas do seu restaurante.">
<meta name="theme-color" content="#0F4C5C">
<script>(function(){try{var v=localStorage.getItem("vg_tema");var d=v==="escuro"||(v==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");if(d)document.querySelector('meta[name="theme-color"]').setAttribute("content","#0A1319");}catch(e){}})();</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viéstec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
:root{
  --bg:#D9E5EB; --surface:#EDF4F7; --surface2:#CFDFE6; --ink:#0B1720; --ink2:#364652; --line:#AFC4CD;
  --brand:#0F4C5C; --brand-ink:#FFFFFF; --accent:#D98A1F; --ok:#2E7D5B; --bad:#B3261E; --warn:#B4640F;
  --roxo:#6D4FC2; --tint:#FFFFFF; --field:#FFFFFF; --hover:#E2EDF2; --mark-bg:#FDE6B8; --sk-hi:#E6EFF3; --sombra:rgba(15,76,92,.07);
  color-scheme:light;
  --f-display:"Inter","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font:15.5px/1.55 var(--f-body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.15}
.num{font-family:var(--f-body);font-variant-numeric:tabular-nums;font-weight:500;text-align:right;white-space:nowrap}

/* ---- login ---- */
.login{min-height:100vh;min-height:100dvh;background:#07131B;background-image:radial-gradient(900px 600px at 85% 10%,rgba(26,138,160,.28),transparent 60%),radial-gradient(700px 500px at 10% 100%,rgba(217,138,31,.16),transparent 60%),radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:auto,auto,22px 22px;color:#E8F1F5;display:flex;align-items:center;justify-content:center;padding:24px}
.lg-wrap{width:100%;max-width:1180px;display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
.lg-hero{position:relative;margin:0;border-radius:28px;overflow:hidden;height:min(calc(100vh - 48px),820px);min-height:520px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);background:#0B1D27}
.lg-hero img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block}
.lg-hero figcaption{position:absolute;inset:auto 0 0 0;padding:90px 30px 28px;background:linear-gradient(to top,rgba(7,19,27,.94) 10%,rgba(7,19,27,.6) 55%,transparent);display:flex;flex-direction:column;gap:8px}
.lg-hero h2{font-size:30px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1.1}
.lg-hero p{margin:0;color:rgba(232,241,245,.78);font-size:15px}
.lg-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.lg-chips span{font-size:12px;font-weight:700;color:#CFE7EE;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:4px 11px;border-radius:999px;backdrop-filter:blur(6px)}
.lg-side{display:flex;justify-content:center}
.lg-card{width:100%;max-width:410px;display:flex;flex-direction:column;gap:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:36px 34px;backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lg-card .wordmark{color:#fff;font-size:24px}
.lg-card .wordmark span{color:rgba(232,241,245,.6)}
.lg-card h1{font-size:26px;font-weight:800;color:#fff;margin-top:6px}
.lg-sub{margin:-10px 0 4px;color:rgba(232,241,245,.65);font-size:14.5px}
.lg-f{display:flex;flex-direction:column;gap:7px}
.lg-f label{color:rgba(232,241,245,.8);font-size:13px;font-weight:700}
.lg-in{position:relative;display:flex;align-items:center}
.lg-in>svg{position:absolute;left:14px;width:18px;height:18px;fill:none;stroke:rgba(232,241,245,.5);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;transition:stroke .15s}
.lg-in input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:12px;min-height:50px;padding:12px 46px 12px 44px;font-size:15.5px;transition:border-color .15s,box-shadow .15s,background .15s}
.lg-in input::placeholder{color:rgba(232,241,245,.35)}
.lg-in input:focus{outline:none;border-color:#2BB3CF;background:rgba(255,255,255,.09);box-shadow:0 0 0 4px rgba(43,179,207,.18)}
.lg-in:focus-within>svg{stroke:#2BB3CF}
.lg-in input:-webkit-autofill{-webkit-text-fill-color:#fff;-webkit-box-shadow:0 0 0 40px #10242F inset;caret-color:#fff}
.lg-olho{position:absolute;right:8px;width:36px;height:36px;border:0;background:none;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:rgba(232,241,245,.55)}
.lg-olho:hover{color:#fff;background:rgba(255,255,255,.08)}
.lg-olho svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lg-caps{font-size:12.5px;color:#F2B45A;min-height:0}
.lg-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:rgba(232,241,245,.7)}
.lg-lembrar{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:13.5px;color:rgba(232,241,245,.78)}
.lg-lembrar input{width:17px;height:17px;min-height:0;accent-color:#2BB3CF;margin:0}
.lg-btn{position:relative;font:inherit;font-size:16px;font-weight:800;color:#fff;border:0;border-radius:12px;min-height:52px;cursor:pointer;background:linear-gradient(135deg,#0F4C5C,#1A8AA0);box-shadow:0 10px 30px rgba(26,138,160,.35);transition:transform .12s,box-shadow .15s,filter .15s;display:flex;align-items:center;justify-content:center;gap:10px}
.lg-btn:hover{filter:brightness(1.1);box-shadow:0 14px 36px rgba(26,138,160,.5)}
.lg-btn:active{transform:translateY(1px)}
.lg-btn:disabled{opacity:.75;cursor:wait}
.lg-spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:lgspin .7s linear infinite;display:none}
.lg-btn.carregando .lg-spin{display:block}
@keyframes lgspin{to{transform:rotate(360deg)}}
.lg-err{margin:0;font-size:14px;color:#FFB4AC;background:rgba(179,38,30,.18);border:1px solid rgba(255,120,110,.3);border-radius:10px;padding:10px 12px}
.lg-err:empty{display:none}
.lg-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:rgba(232,241,245,.45);padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.lg-foot span{display:inline-flex;align-items:center;gap:6px}
.lg-foot svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:900px){
  .login{padding:14px;align-items:flex-start}
  .lg-wrap{grid-template-columns:1fr;gap:18px}
  .lg-hero{height:230px;min-height:0;border-radius:22px}
  .lg-hero img{object-position:center 42%}
  .lg-hero figcaption{padding:50px 18px 16px}
  .lg-hero h2{font-size:21px}.lg-hero p,.lg-chips{display:none}
  .lg-card{padding:26px 22px;border-radius:20px}
  .lg-card h1{font-size:22px}
}
.wordmark{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:22px;font-weight:700}
.wordmark span{font-weight:500;color:var(--ink2)}
.mark{width:30px;height:30px;flex:none}
.mark rect{fill:var(--accent)}
.mark path{stroke:#12212C}
label{font-size:13px;font-weight:600;color:var(--ink2)}
input,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:42px}
.btn{font:600 15px var(--f-body);background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:11px 18px;min-height:44px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--bad);font-size:14px;min-height:18px}

/* ---- shell ---- */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.tenant{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:var(--ink);padding-left:16px;border-left:1px solid var(--line);letter-spacing:-.005em}
.top-data{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 10px;white-space:nowrap}
.top-data svg{width:15px;height:15px;fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top-data i{font-style:normal;margin:0 6px;opacity:.6}
.top-data b{font-weight:700;color:var(--brand)}.top-data b.fim{color:var(--warn)}
.td-curta{display:none}
.tenant-logo{height:36px;width:auto;border-radius:8px;display:block;flex:none;box-shadow:0 1px 4px rgba(11,23,32,.18)}
.tenant svg{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top .sair{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;color:var(--ink);font:inherit}
.page{padding:28px 20px 60px;max-width:1100px;margin:0 auto}
.page:has(.modwrap){max-width:none;padding-left:20px;padding-right:20px}
.modwrap{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;align-items:start}
.side{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 4px 18px rgba(15,76,92,.07);position:sticky;top:16px}
.side-tit{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding:6px 10px 8px}
.side a,.side button{appearance:none;-webkit-appearance:none;-moz-appearance:none;width:100%;margin:0;display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:13px;text-align:left;font-size:14.5px;font-weight:600;color:var(--ink2);border:1px solid transparent;background:none;cursor:pointer;font-family:inherit;transition:background .15s,color .15s,box-shadow .15s}
.side button:hover{background:color-mix(in srgb,var(--brand) 8%,var(--surface));color:var(--ink)}
.side button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.nav-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);color:var(--brand);flex:none;transition:background .15s,color .15s}
.nav-ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-txt{flex:1;min-width:0}
.side button.on{background:linear-gradient(135deg,var(--brand),#1A6A7E);color:#fff;box-shadow:0 6px 16px rgba(15,76,92,.28)}
.side button.on .nav-ico{background:rgba(255,255,255,.18);color:#fff}
.navbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:1;flex:none}
.ctl{display:flex;gap:12px;align-items:end;margin-bottom:20px;flex-wrap:wrap}
.ctl div{display:flex;flex-direction:column;gap:4px}
.ctl label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.main h1{font-size:26px;color:var(--brand)}
.main-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mes-pick{position:relative;display:inline-flex}
.mes-pick-txt{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;transition:border-color .15s,color .15s}
.mes-pick:hover .mes-pick-txt{border-color:var(--brand);color:var(--ink)}
.mes-pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0;min-height:0;border:0}
.ctxline{font-size:13px;color:var(--ink2);margin:0}
#conteudo>.ctxline:first-child{margin-top:-10px}

/* ---- resumo ---- */
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.resumo>div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.resumo span{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.resumo b{font-size:21px;font-weight:500}
.resumo b.good{color:var(--ok)}.resumo b.bad{color:var(--bad)}
.resumo em{font-style:normal;font-size:13.5px;font-weight:500;color:var(--ink2);margin-top:3px}
.resumo em.good{color:var(--ok)}.resumo em.bad{color:var(--bad)}

/* ---- tabela DRE ---- */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:14px}
th{background:var(--brand);color:var(--brand-ink);text-align:left;padding:10px 14px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
th.num{text-align:right}
td{padding:10px 14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tr.subgrupo-row td{background:var(--surface2);font-weight:700;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);padding:8px 14px;border-top:1px solid var(--line)}
tr.subgrupo-total td{font-weight:600;background:var(--surface2)}
tr.subgrupo-total td:first-child{padding-left:14px}
tfoot td{font-weight:700;border-top:2px solid var(--line);background:var(--surface2)}
.v-good{color:var(--ok)}.v-bad{color:var(--bad)}

/* ---- metas / alertas ---- */
.mrcards{display:flex;flex-direction:column;gap:10px}
.mrcard{background:var(--surface);border-radius:10px;padding:14px 16px;border-left:4px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mrcard.t-receita{border-left-color:var(--ok)}.mrcard.t-custo{border-left-color:var(--warn)}.mrcard.t-despesa{border-left-color:var(--brand)}
.mrcard-name{font-size:14px;font-weight:600}
.mrcard-nums{font-size:13px;color:var(--ink2)}
.mrcard-pct{font-size:19px;font-weight:700;white-space:nowrap}
.mrcard-pct.good{color:var(--ok)}.mrcard-pct.bad{color:var(--bad)}
.mrcard-meta{font-size:12.5px;color:var(--ink2);font-weight:400}
.alert{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:13px 16px;margin-bottom:10px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;color:var(--ink2)}

/* ---- painel: top contas / crescimento ---- */
.sect{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin:4px 0}
.toplists{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.topcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.topcard h3{font-size:14px;font-weight:600;color:var(--ink)}
.topcard.t-receita h3{color:var(--ok)}.topcard.t-custo h3{color:var(--warn)}.topcard.t-despesa h3{color:var(--brand)}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.barrow-label{font-size:13px;color:var(--ink);grid-column:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow-val{font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;grid-column:2}
.barrow-track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.barrow-fill{height:100%;border-radius:3px}
.growth-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.growth-list-scroll{flex:1;min-height:340px;max-height:520px;overflow-y:auto;background:var(--surface);gap:0}
.growth-list-scroll .growth-row{border-bottom:1px solid var(--line)}
.dual-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
.dual-cols>div{display:flex;flex-direction:column;min-height:0}
.pizza-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.pizza{width:110px;height:110px;border-radius:50%;flex:none}
.pizza-legend{display:flex;flex-direction:column;gap:8px;flex:1 1 140px;min-width:140px}
.pizza-leg{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);flex-wrap:wrap}
.pizza-leg b{color:var(--ink);font-weight:700}
.pizza-leg .hint{margin:0;font-size:12px}
.pizza-leg .dot{width:10px;height:10px;border-radius:50%;flex:none}
.cmp-wrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.cmp-legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin-bottom:2px}
.cmp-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.cmp-row{display:flex;flex-direction:column;gap:4px}
.cmp-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.cmp-bars{display:flex;flex-direction:column;gap:3px}
.cmp-bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.cmp-bar-fill{height:100%;border-radius:4px;background:var(--ink2)}
.cmp-bar-fill.cmp-bar-ant{opacity:.45}
.cmp-vals{display:flex;justify-content:space-between;font-size:12.5px}
.cmp-ant{color:var(--ink2)}
.cmp-atual{font-weight:700}
@media (max-width:820px){ .dual-cols{grid-template-columns:1fr} }
.growth-row{background:var(--surface);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.growth-name{font-size:13.5px;font-weight:700}
.growth-nums{font-size:13.5px;color:var(--ink2)}
.growth-era{color:var(--ink2)}
.growth-delta{color:var(--accent);font-weight:600}
.growth-agora{color:var(--brand);font-weight:600}
.growth-realizado{color:var(--bad);font-weight:600}
.growth-meta{color:var(--warn);font-weight:600}
.growth-pct{font-size:14px;font-weight:700;white-space:nowrap}
.growth-pct.up-good{color:var(--ok)}.growth-pct.up-bad{color:var(--bad)}

/* ---- importar ---- */
.import-box{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.hint{font-size:13px;color:var(--ink2);margin:4px 0 0}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.loading{color:var(--ink2);font-style:italic}
.preview{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.preview-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ctl2{display:flex;flex-direction:column;gap:4px}
.ctl2 label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.warn-line{color:var(--warn);font-size:13px;margin:0}
.mono{font-family:var(--f-mono)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--ink2)}
.pill.ok{background:var(--ok);color:#fff}
.preview-foot{display:flex;justify-content:flex-end;gap:10px}
#impDiag{width:100%;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,.3)}


/* ---- cards de resumo do painel ---- */
.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.rcard{--c:var(--brand);position:relative;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 13%,var(--surface)) 0%,var(--surface) 65%);border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:4px solid var(--c);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 10px rgba(15,76,92,.06)}
.rcard.t-receita{--c:var(--ok)}.rcard.t-custo{--c:var(--warn)}.rcard.t-despesa{--c:var(--brand)}
.rcard.t-resultado.pos{--c:var(--roxo)}.rcard.t-resultado.neg{--c:var(--bad)}
.rc-head{display:flex;align-items:center;gap:10px}
.rc-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--tint));color:var(--c);flex:none}
.rc-ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rc-nome{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--c)}
.rc-valor{font-size:27px;font-weight:800;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}
.rcard.t-resultado .rc-valor{color:var(--c)}
.rc-meta{display:flex;flex-direction:column;gap:5px;margin-top:4px;padding-top:10px;border-top:1px dashed color-mix(in srgb,var(--c) 30%,var(--line))}
.rc-meta-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;color:var(--ink2)}
.rc-meta-top strong{font-size:15px;font-weight:800}
.rc-bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.rc-bar i{display:block;height:100%;border-radius:4px}
.rc-bar i.good{background:var(--ok)}.rc-bar i.bad{background:var(--bad)}
.rc-dica{font-size:12.5px;color:var(--ink2)}
.rc-dica.good,.rc-meta-top strong.good{color:var(--ok)}.rc-dica.bad,.rc-meta-top strong.bad{color:var(--bad)}
@media (max-width:720px){ .rcards{grid-template-columns:1fr 1fr;gap:10px} .rc-valor{font-size:18px} .rcard{padding:12px} .rc-meta-top{flex-direction:column;gap:0} }


#conteudo{display:flex;flex-direction:column;gap:16px;min-width:0}
#conteudo>.hint{margin:-6px 0 -8px}
/* ---- cor por tipo (usada em DRE, Metas e Alertas) ---- */
.t-receita{--c:var(--ok)}.t-custo{--c:var(--warn)}.t-despesa{--c:var(--brand)}.t-outros{--c:var(--ink2)}.t-resultado{--c:var(--roxo)}
.grp-ico,.dchip-ico{display:inline-grid;place-items:center;border-radius:8px;background:color-mix(in srgb,var(--c) 17%,var(--tint));color:var(--c);flex:none}
.grp-ico{width:26px;height:26px;margin-right:9px;vertical-align:middle}
.grp-ico svg,.dchip-ico svg,.ab-ico svg{fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.grp-ico svg{width:16px;height:16px}

/* ---- DRE ---- */
.dchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.dchip{display:flex;gap:12px;align-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 11%,var(--surface)),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));border-left:4px solid var(--c);border-radius:11px;padding:12px 14px}
.dchip.t-resultado.neg{--c:var(--bad)}
.dchip-ico{width:36px;height:36px;border-radius:10px}.dchip-ico svg{width:20px;height:20px}
.dchip>div{display:flex;flex-direction:column;min-width:0}
.dchip-lbl{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.dchip b{font-size:19px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.dchip.t-resultado b{color:var(--c)}
.dchip-sub{font-size:12.5px;color:var(--ink2);font-weight:600}.dchip-sub.good{color:var(--ok)}.dchip-sub.bad{color:var(--bad)}
.dre-wrap{border-radius:12px;box-shadow:0 2px 10px rgba(15,76,92,.05)}
.dre2 th{position:sticky;top:0;z-index:1}
.dre2 tr.grp td{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);font-weight:800;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;border-left:4px solid var(--c);padding:9px 14px;border-top:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.grp-n{margin-left:10px;font-weight:600;color:var(--ink2);text-transform:none;letter-spacing:0;font-size:12px}
.dre2 tr.clk td:first-child{text-decoration:none;border-left:4px solid color-mix(in srgb,var(--c) 30%,transparent)}
.dre-nome .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:10px;vertical-align:middle}
.dre2 td.ant,.dre2 td.meta{color:var(--ink2)}
.dre2 td.real{font-weight:700;color:var(--ink)}
.pm{display:inline-block;min-width:60px;text-align:center;padding:3px 10px;border-radius:999px;font-weight:700;font-size:12.5px}
.pm.good{background:color-mix(in srgb,var(--ok) 15%,var(--tint));color:var(--ok)}.pm.warn{background:color-mix(in srgb,var(--warn) 14%,var(--tint));color:var(--warn)}.pm.bad{background:color-mix(in srgb,var(--bad) 12%,var(--tint));color:var(--bad)}.pm.mute{color:var(--ink2)}
.dif{font-weight:700}.dif.good{color:var(--ok)}.dif.bad{color:var(--bad)}.dif.mute{color:var(--ink2);font-weight:400}
.dre2 tr.grp-total td{background:color-mix(in srgb,var(--c) 7%,var(--surface));font-weight:700;border-top:2px solid color-mix(in srgb,var(--c) 45%,var(--line))}
.dre2 tr.grp-total td:first-child{border-left:4px solid var(--c)}
.dre2 tr.grp-total td.real{color:var(--c)}
.dre2 tfoot tr.pos{--c:var(--roxo)}.dre2 tfoot tr.neg{--c:var(--bad)}
.dre2 tfoot td{background:color-mix(in srgb,var(--c) 12%,var(--surface));font-size:15px;border-top:3px solid var(--c);padding:13px 14px}
.dre2 tfoot td:first-child{color:var(--c);font-weight:800}
.dre2 tfoot td.real{color:var(--c);font-size:18px;font-weight:800}

/* ---- METAS ---- */
.msum{font-size:15px;color:var(--ink2)}.msum b{color:var(--ink);font-size:18px;font-weight:800}.msum span{margin-left:6px;font-size:13.5px}
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.mc-alvo{margin-left:auto;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--tint));padding:3px 10px;border-radius:999px;white-space:nowrap}
.mc-var{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.mc-var.good{color:var(--ok)}.mc-var.bad{color:var(--bad)}
.mc-var small{font-size:13px;color:var(--ink2);font-weight:500;margin-left:8px;letter-spacing:0}
.mc-cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 0 4px;border-top:1px dashed color-mix(in srgb,var(--c) 30%,var(--line));margin-top:6px}
.mc-cmp span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.mc-cmp b{font-size:14px;font-variant-numeric:tabular-nums}
.mc-cmp div:last-child b{color:var(--warn)}
.mc-foot{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink2)}
.mc-status{font-weight:800}.mc-status.good{color:var(--ok)}.mc-status.bad{color:var(--bad)}
.metaform2{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:16px}
.mf-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.mf-head h3{font-size:17px;color:var(--brand)}
.toggle{display:inline-flex;align-items:center;gap:10px;font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer;background:var(--surface2);padding:8px 14px 8px 8px;border-radius:999px}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.tg{width:42px;height:24px;border-radius:999px;background:#9FB3BC;position:relative;transition:background .15s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.toggle input:checked+.tg{background:var(--ok)}.toggle input:checked+.tg::after{left:21px}
.toggle input:focus-visible+.tg{outline:2px solid var(--brand);outline-offset:2px}
.mf-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mf-cols fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 16px 16px;margin:0;display:flex;flex-direction:column;gap:14px;min-width:0}
.mf-cols legend{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);padding:0 6px}
.mf{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px}
.mf label{display:flex;align-items:center;gap:9px;color:var(--ink);font-size:14.5px;font-weight:700}
.mf .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.mf small{grid-column:1;color:var(--ink2);font-size:12px;padding-left:19px}
.mf-in{grid-column:2;grid-row:1/3;display:flex;align-items:stretch;border:1px solid var(--line);border-radius:9px;background:var(--field);overflow:hidden;width:110px}
.mf-in:focus-within{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.mf-in input{border:0;border-radius:0;min-height:40px;text-align:right;font-weight:700;padding:8px 8px;outline:none}
.mf-in span{padding:0 11px;color:var(--c);font-weight:800;background:color-mix(in srgb,var(--c) 10%,var(--tint));display:grid;place-items:center}

/* ---- ALERTAS ---- */
.abanner,.aok{display:flex;gap:14px;align-items:center;border-radius:12px;padding:14px 18px}
.abanner{background:color-mix(in srgb,var(--bad) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 32%,var(--line));border-left:5px solid var(--bad)}
.aok{--c:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 32%,var(--line));border-left:5px solid var(--ok)}
.aok b{font-size:16px;color:var(--ok)}
.ab-ico{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--bad) 15%,var(--tint));color:var(--bad);display:grid;place-items:center;flex:none}
.ab-ico svg{width:24px;height:24px}
.abanner b{font-size:16px;color:var(--ink)}.abanner p{margin:2px 0 0;color:var(--ink2);font-size:14px}.abanner strong{color:var(--bad)}
.agcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.ag-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.ag-nums span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.ag-nums b{font-size:15px;font-variant-numeric:tabular-nums}.ag-nums b.bad{color:var(--bad)}
.ablocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.ablock{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(15,76,92,.05)}
.ablock-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.ablock-head .rc-ico{width:32px;height:32px}
.ablock-head h3{font-size:15px;color:var(--c);font-weight:800}
.ablock-n{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--bad);white-space:nowrap}
.arow{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px;cursor:pointer}
.arow:hover{background:var(--hover)}
.arow-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.arow-nome{font-size:14px;font-weight:800}
.arow-exc{font-weight:800;color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--tint));padding:2px 10px;border-radius:999px;font-size:13px;white-space:nowrap}
.abar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface2)}
.abar .ok{background:color-mix(in srgb,var(--c) 55%,var(--tint))}.abar .over{background:var(--bad)}
.arow-bot{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.c-meta{color:var(--warn)}.c-real{color:var(--bad)}
.arow-pct{margin-left:auto;font-weight:800;color:var(--bad)}

@media (max-width:720px){
  .dchips{grid-template-columns:1fr 1fr;gap:10px}
  .dchip{padding:10px;gap:8px}.dchip-ico{display:none}.dchip b{font-size:16px}
  .dre2 tr.clk,.dre2 tr.grp-total,.dre2 tr.grp{border-left:4px solid var(--c)}
  .dre2 td,.dre2 tr.clk td:first-child,.dre2 tr.grp-total td:first-child,.dre2 tr.grp td{border-left:0 !important;background:transparent}
  .dre2 tr.grp{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
  .dre2 tr.grp-total{background:color-mix(in srgb,var(--c) 7%,var(--surface))}
  .dre2 tfoot tr{border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
  .dre2 tfoot td{border-top:0;padding:3px 0}
  .dre2 th{position:static}
  .mf-cols{grid-template-columns:1fr}
  .mc-var{font-size:26px}
  .ablocks{grid-template-columns:1fr}
  .ag-nums b{font-size:13.5px}
  .dre2 tr.grp td,.dre2 td.dre-nome{justify-content:flex-start;align-items:center;text-align:left}
  .dre2 tr.grp td{border-top:0;padding:4px 0}
  .dre2 td.dre-nome{padding-bottom:6px}
  .grp-n{margin-left:auto}
  .mc-cmp b{font-size:12.5px}
  .mc-cmp span{font-size:10px}
  .arow-pct{margin-left:0}
  .arow-bot{row-gap:2px}
}


/* ---- histórico de importações ---- */
.imp-hist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(15,76,92,.05)}
.ih-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--brand) 8%,var(--surface));border-bottom:1px solid var(--line)}
.ih-head h3{font-size:15px;color:var(--brand);font-weight:800}
.ih-sub{margin-left:auto;font-size:12.5px;color:var(--ink2)}
.ih-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--brand) 14%,var(--tint));color:var(--brand)}
.ih-ico svg,.ih-arq svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ih-ico svg{width:18px;height:18px}
.ih-row{display:grid;grid-template-columns:130px minmax(0,1fr) 170px 70px 110px;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);font-size:14px}
.ih-row:first-child{border-top:0}
.ih-th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:800;padding-top:9px;padding-bottom:9px}
.ih-quando b{display:block;font-weight:800}.ih-quando small{color:var(--ink2);font-size:12.5px}
.ih-arq{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ih-arq svg{width:17px;height:17px;color:var(--bad);flex:none}
.ih-n{font-weight:700}
.ih-st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800}
.ih-st.ok{background:color-mix(in srgb,var(--ok) 14%,var(--tint));color:var(--ok)}
.ih-st.erro{background:color-mix(in srgb,var(--bad) 12%,var(--tint));color:var(--bad)}
.ih-st.desfeita{background:var(--surface2);color:var(--ink2)}
#impArea:empty{display:none}
.ih-empty{margin:0;padding:18px 16px;color:var(--ink2);font-size:14px}


/* ---- dicas ---- */
.dchips-f{display:flex;gap:8px;flex-wrap:wrap}
.dfil{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font:inherit;font-size:13.5px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.dfil:hover{border-color:var(--brand);color:var(--ink)}
.dfil.on{background:var(--brand);border-color:var(--brand);color:#fff}
.dsec{display:flex;flex-direction:column;gap:10px}
.dsec[hidden],.dcard[hidden]{display:none}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.dcard{background:linear-gradient(165deg,color-mix(in srgb,var(--c) 9%,var(--surface)),var(--surface) 55%);border:1px solid color-mix(in srgb,var(--c) 25%,var(--line));border-top:4px solid var(--c);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 10px rgba(15,76,92,.05)}
.dc-top{display:flex;align-items:center;gap:9px}
.dc-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,var(--tint));color:var(--c);flex:none}
.dc-ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dc-cat{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.dc-auto{margin-left:auto;font-size:11px;font-weight:800;color:#fff;background:var(--accent);padding:2px 9px;border-radius:999px}
.dcard h3{font-size:16px;color:var(--ink);line-height:1.3}
.dcard p{margin:0;font-size:14px;color:var(--ink2);line-height:1.55;flex:1}
.dc-foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:4px}
.dc-tag{color:var(--ink2);font-weight:700}
.dc-imp{color:var(--ink2);font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface2)}
.dc-imp.alto{color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--tint))}
@media (max-width:720px){ .dgrid{grid-template-columns:1fr} .dchips-f{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px} .dfil{flex:none} }


/* ---- margens ---- */
.mg-aviso{background:color-mix(in srgb,var(--warn) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-left:4px solid var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink)}
.mg-hint{margin:0}
.mg-list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(15,76,92,.05)}
.mg-row{display:grid;grid-template-columns:minmax(0,1.7fr) 120px 120px 120px 130px;gap:4px 14px;align-items:center;padding:10px 16px 12px;border-top:1px solid var(--line)}
.mg-row:first-child{border-top:0}
.mg-th{background:var(--brand);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px}
.mg-th .num{text-align:right}
.mg-nome{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.mg-nome b{font-size:14.5px;font-weight:800}
.mg-tag{font-size:11px;font-weight:700;color:var(--ink2);background:var(--surface2);padding:2px 8px;border-radius:999px;white-space:nowrap}
.mg-tag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--tint))}
.mg-c{color:var(--warn)}
.mg-m{font-weight:800;color:var(--ok)}.mg-m.bad{color:var(--bad)}
.mg-p{display:flex;flex-direction:column;align-items:flex-end;gap:2px}

/* ---- animações do financeiro ---- */
@keyframes aSobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes aBarra{from{transform:scaleX(0)}to{transform:none}}
@keyframes aPizza{from{--ang:0deg;transform:rotate(-40deg) scale(.9)}to{--ang:360deg;transform:none}}
@keyframes aPulsa{0%{box-shadow:0 0 0 0 rgba(179,38,30,.55)}70%{box-shadow:0 0 0 9px rgba(179,38,30,0)}100%{box-shadow:0 0 0 0 rgba(179,38,30,0)}}
@keyframes aBrilho{from{background-position:200% 0}to{background-position:-200% 0}}
@property --ang{syntax:'<angle>';inherits:false;initial-value:360deg}
/* 4. cascata */
.anim>*{animation:aSobe .45s cubic-bezier(.2,.7,.2,1) both}
.anim>*:nth-child(2){animation-delay:.06s}.anim>*:nth-child(3){animation-delay:.12s}.anim>*:nth-child(4){animation-delay:.18s}.anim>*:nth-child(5){animation-delay:.24s}.anim>*:nth-child(n+6){animation-delay:.3s}
.anim :is(.rcards,.kpis,.toplists,.dchips,.mcards,.dgrid,.agcards,.ablocks,.pj-nums)>*{animation:aSobe .45s cubic-bezier(.2,.7,.2,1) both}
.anim :is(.rcards,.kpis,.toplists,.dchips,.mcards,.dgrid,.agcards,.ablocks,.pj-nums)>*:nth-child(2){animation-delay:.08s}
.anim :is(.rcards,.kpis,.toplists,.dchips,.mcards,.dgrid,.agcards,.ablocks,.pj-nums)>*:nth-child(3){animation-delay:.16s}
.anim :is(.rcards,.kpis,.toplists,.dchips,.mcards,.dgrid,.agcards,.ablocks,.pj-nums)>*:nth-child(n+4){animation-delay:.24s}
/* 2. barras crescendo */
.anim :is(.rc-bar i,.barrow-fill,.cmp-bar-fill,.pj-dias i,.mg-bar,.abar){transform-origin:left center;animation:aBarra .9s cubic-bezier(.2,.7,.2,1) .25s both}
/* 3. pizza se desenhando */
.anim .pizza{-webkit-mask:conic-gradient(#000 var(--ang),transparent 0);mask:conic-gradient(#000 var(--ang),transparent 0);animation:aPizza 1.1s cubic-bezier(.2,.7,.2,1) .2s both}
/* 6. alerta pulsando */
.navbadge.pulsa{animation:aPulsa 1.6s ease-out .6s 3}
/* 7. cards que levantam */
:is(.rcard,.kpi,.topcard,.dchip,.dcard,.ablock,.pj-nums>div,.pizza-wrap,.cmp-wrap){transition:transform .18s ease,box-shadow .18s ease}
@media (hover:hover){:is(.rcard,.kpi,.topcard,.dchip,.dcard,.ablock,.pj-nums>div,.pizza-wrap,.cmp-wrap):hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(15,76,92,.13)}}
/* 5. carregando */
.sk{border-radius:12px;background:linear-gradient(90deg,var(--surface2) 25%,var(--sk-hi) 50%,var(--surface2) 75%);background-size:200% 100%;animation:aBrilho 1.3s linear infinite}
.sk-wrap{display:flex;flex-direction:column;gap:16px}
.sk-linha{height:14px;width:45%;border-radius:7px}
.sk-grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.sk-grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.sk-card{height:150px}.sk-card.sk-baixo{height:190px}
.sk-faixa{height:110px}
.sk-logo{width:200px;height:30px;border-radius:8px}.sk-btn{width:70px;height:34px;border-radius:8px}
.sk-nav{height:44px;border-radius:12px}
@media (max-width:720px){ .sk-grid4{grid-template-columns:1fr 1fr} .sk-card{height:120px} .sk-nav{flex:1;height:48px} .sk-logo{width:160px} }
@media (prefers-reduced-motion: reduce){
  .anim>*,.anim *{animation:none!important}
  .navbadge.pulsa{animation:none}
  .sk{animation:none}
  :is(.rcard,.kpi,.topcard,.dchip,.dcard,.ablock,.pj-nums>div,.pizza-wrap,.cmp-wrap):hover{transform:none}
}


/* ---- animações parte 2 ---- */
@keyframes aDaDir{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes aDaEsq{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes aLinha{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes aPop{0%{transform:scale(0) rotate(-60deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:none}}
@keyframes aCelebra{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes aFlashV{from{background:rgba(46,125,91,.32)}to{background:transparent}}
@keyframes aFlashR{from{background:rgba(179,38,30,.26)}to{background:transparent}}
@keyframes aGira{to{transform:rotate(360deg)}}
@keyframes aTraco{to{stroke-dashoffset:0}}
/* 1. indicador do menu */
.side button{position:relative;z-index:1}
.side-tit{position:relative;z-index:1}
.side-ind{position:absolute;left:0;top:0;width:0;height:0;border-radius:13px;background:linear-gradient(135deg,var(--brand),#1A6A7E);box-shadow:0 6px 16px rgba(15,76,92,.28);z-index:0;pointer-events:none;transition:transform .38s cubic-bezier(.2,.8,.2,1),width .38s cubic-bezier(.2,.8,.2,1),height .38s cubic-bezier(.2,.8,.2,1)}
.side.com-ind button.on{background:transparent;box-shadow:none}
/* 2. direção */
.anim.vem-dir>*{animation-name:aDaDir}
.anim.vem-esq>*{animation-name:aDaEsq}
/* 3. grupos do DRE */
.dre-acoes{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-6px 0 -6px}
.dre-acoes .hint{margin:0}
.dre-todos{font:inherit;font-size:13px;font-weight:700;color:var(--brand);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.dre-todos:hover{border-color:var(--brand)}
.dre2 tr.grp{cursor:pointer;user-select:none}
.dre2 tr.grp:hover td{filter:brightness(.97)}
.dre2 tr.grp:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.grp-chev{float:right;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;transition:transform .25s ease}
.grp-chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
tr.grp.fechado .grp-chev{transform:rotate(-90deg)}
tr[data-gm].oculta{display:none}
tr[data-gm].saindo{opacity:0;transition:opacity .16s}
@media (max-width:720px){ .dre2 tr.grp td{position:relative} .grp-chev{position:absolute;right:0;top:50%;margin-top:-12px;float:none} }
/* 4. meta batida */
.rc-ok{margin-left:auto;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;flex:none;box-shadow:0 3px 8px rgba(46,125,91,.35)}
.rcard.celebra .rc-ok{animation:aPop .7s cubic-bezier(.2,1.4,.4,1) 1s both}
.rcard::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 2px var(--ok),inset 0 0 36px rgba(46,125,91,.35)}
.rcard.celebra::after{animation:aCelebra 2.2s ease-out 1s 1}
/* 5. importação */
.imp-prog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ip-top{display:flex;align-items:center;gap:10px;font-size:14.5px}
.ip-spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--surface2);border-top-color:var(--brand);animation:aGira .7s linear infinite;flex:none}
.ip-bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.ip-bar i{display:block;height:100%;width:4%;background:linear-gradient(90deg,var(--brand),#1A8AA0);border-radius:4px;transition:width .3s ease}
.ip-row{animation:aLinha .3s cubic-bezier(.2,.7,.2,1) both}
.imp-ok{display:flex;align-items:center;gap:16px;background:color-mix(in srgb,var(--ok) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line));border-radius:12px;padding:18px 20px}
.imp-ok svg{width:52px;height:52px;flex:none;fill:none;stroke:var(--ok);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.imp-ok circle{stroke-dasharray:145;stroke-dashoffset:145;animation:aTraco .6s ease-out forwards}
.imp-ok path{stroke-dasharray:40;stroke-dashoffset:40;animation:aTraco .4s ease-out .5s forwards}
.imp-ok b{display:block;font-size:17px;color:var(--ok)}
.imp-ok span{color:var(--ink2);font-size:14px}
/* 6. puxar pra atualizar */
body{overscroll-behavior-y:contain}
.ptr{position:fixed;top:env(safe-area-inset-top,0px);left:50%;transform:translate(-50%,-50px);width:42px;height:42px;border-radius:50%;background:var(--surface);box-shadow:0 6px 18px rgba(11,23,32,.25);display:grid;place-items:center;color:var(--brand);opacity:0;z-index:60;pointer-events:none;transition:transform .25s ease,opacity .25s ease,color .15s}
.ptr svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ptr.pronto{color:var(--ok)}
.ptr.girando{opacity:1}
.ptr.girando svg{animation:aGira .7s linear infinite}
/* 7. valores que mudaram */
.dre2 tr.flash-sobe td{animation:aFlashV 1.3s ease-out .7s 2}
.dre2 tr.flash-desce td{animation:aFlashR 1.3s ease-out .7s 2}
@media (prefers-reduced-motion: reduce){
  .side-ind,.grp-chev{transition:none}
  .ip-row,.imp-ok circle,.imp-ok path,.rcard.celebra::after,.rcard.celebra .rc-ok,.dre2 tr[class*="flash-"] td{animation:none!important}
  .imp-ok circle,.imp-ok path{stroke-dashoffset:0}
}


/* ---- busca no DRE ---- */
.dre-acoes{gap:10px 14px}
.dre-busca{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 6px 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;width:230px;transition:width .25s ease,border-color .15s,box-shadow .15s;cursor:text}
.dre-busca:focus-within,.dre-busca.ativa{width:300px;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 14%,transparent)}
.dre-busca svg{width:16px;height:16px;flex:none;fill:none;stroke:var(--ink2);stroke-width:2.2;stroke-linecap:round}
.dre-busca input{border:0;background:none;min-height:0;height:100%;padding:0;font-size:14px;flex:1;min-width:0;outline:none}
.dre-busca input::-webkit-search-cancel-button{display:none}
.db-n{font-size:11.5px;font-weight:800;color:#fff;background:var(--brand);border-radius:999px;padding:1px 7px}
.db-n:empty{display:none}
.db-x{border:0;background:var(--surface2);color:var(--ink2);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center;flex:none}
.db-x[hidden]{display:none}
.dre-acoes .hint{flex:1;min-width:200px}
.dre2 tr.busca-some{display:none!important}
.dre2 tr[data-gm].oculta.busca-mostra{display:table-row}

.dre-vazio{margin:0}
@media (max-width:720px){
  .dre-busca,.dre-busca:focus-within,.dre-busca.ativa{width:100%;order:-1}
  .dre-acoes .hint{min-width:0}
  .dre2 tr[data-gm].oculta.busca-mostra{display:block}
  .dre-acoes .hint{display:none}
  .dre-acoes{justify-content:flex-end}
  .dre2 tr.grp .grp-n{margin-right:30px}
}

/* ---- indicadores ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.kpi.good{border-left-color:var(--ok)}.kpi.warn{border-left-color:var(--warn)}.kpi.bad{border-left-color:var(--bad)}
.kpi-label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.kpi-val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi.good .kpi-val{color:var(--ok)}.kpi.warn .kpi-val{color:var(--warn)}.kpi.bad .kpi-val{color:var(--bad)}
.kpi-ref{font-size:13px;color:var(--ink2)}
.kpi-var{font-size:12.5px;color:var(--ink2)}

/* ---- evolução (linha) ---- */
.evo-wrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.evo-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.evo-legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.evo-svg{width:100%;height:auto;display:block;overflow:visible}
.evo-svg text{font-family:var(--f-body);font-size:11px;fill:var(--ink2)}
.evo-svg .grid{stroke:var(--line);stroke-width:1}
.evo-svg .zero{stroke:var(--ink2);stroke-width:1;stroke-dasharray:3 3}
.evo-note{font-size:12.5px;color:var(--ink2);margin:0}

/* ---- DRE clicável + modal histórico ---- */
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--hover)}
tr.clk td:first-child{text-decoration:underline dotted var(--line);text-underline-offset:3px}
.clk-row{cursor:pointer}
.clk-row:hover{background:var(--hover) !important}
.modal-bg{position:fixed;inset:0;background:rgba(11,23,32,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:620px;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-head h2{font-size:19px;color:var(--brand)}
.modal-close{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer;color:var(--ink);flex:none}
.hist-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hist-list>div{background:var(--surface);display:flex;justify-content:space-between;padding:8px 14px;font-size:14px}

/* ---- metas: formulário ---- */
.metaform{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.metaform h3{font-size:15px;color:var(--ink)}
.metafields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.metafields>div{display:flex;flex-direction:column;gap:4px}
.metafields small{color:var(--ink2);font-size:12px}
.switch{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.switch input{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
.metaform-foot{display:flex;justify-content:flex-end}

@media (max-width:720px){
  .modwrap{grid-template-columns:1fr;gap:14px}
  .modwrap{display:flex;flex-direction:column;align-items:stretch}
  .main{display:contents}
  .modwrap>.side{order:0}
  .main>*{order:1;min-width:0}
  .main>.main-head{order:-1}
  #conteudo>.ctxline:first-child{margin-top:0}
  .side{flex-direction:row;flex-wrap:nowrap;gap:2px;padding:5px;border-radius:16px;position:relative;top:0}
  .side-ind{border-radius:11px}
  .side-tit{display:none}
  .side button{position:relative;width:auto;flex:1 1 0;min-width:0;white-space:nowrap;flex-direction:column;justify-content:center;padding:6px 0 5px;font-size:10px;letter-spacing:-.01em;gap:2px;border-radius:11px;text-align:center}
  .nav-ico{width:24px;height:24px;border-radius:8px;background:transparent}
  .nav-ico svg{width:17px;height:17px}
  .nav-txt{flex:none}
  .side button .navbadge{position:absolute;top:3px;right:calc(50% - 22px)}
  .navbadge{min-width:16px;height:16px;font-size:10px;padding:0 4px}
  .growth-row{flex-wrap:nowrap;align-items:flex-start}
  .growth-pct{padding-top:1px}
  .pizza-wrap{flex-direction:column;align-items:stretch}
  .pizza{width:120px;height:120px;align-self:center}
  .pizza-legend{flex:none}
  .pizza-leg{flex-wrap:nowrap}
  .pizza-leg .hint{margin-left:auto}
  .resumo>div:last-child:nth-child(odd){grid-column:1/-1}
  .page:has(.modwrap){padding:16px 12px 40px}
  .top{padding:10px 12px;gap:10px}
  .top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .top .wordmark{grid-column:1;grid-row:1}
  .top-acoes{grid-column:2;grid-row:1;justify-self:end}
  .top-inst span{display:none}
  .top-inst{padding:7px 9px}
  .tenant{grid-column:1;grid-row:2;min-width:0;border-left:0;padding-left:0;font-size:13px;gap:7px}
  .top-data{grid-column:2;grid-row:2;justify-self:end}
  .tenant-nome{min-width:0;line-height:1.2}
  .top{row-gap:8px}
  .tenant-logo{height:30px;border-radius:7px}
  .top .sair{margin-left:auto}
  .top-data{order:4;margin-left:auto;padding:3px 9px;font-size:12px;gap:5px}
  .top-data svg{display:none}
  .td-full{display:none}.td-curta{display:inline}
  .top-data i{margin:0 4px}
  .ih-row{grid-template-columns:1fr auto;gap:4px 10px;padding:10px 14px}
  .ih-th{display:none}
  .ih-sub{display:none}
  .ih-arq{grid-column:1/-1;order:-1}
  .ih-comp,.ih-n{font-size:13px;color:var(--ink2)}
  .ih-n::after{content:' contas'}
  .main h1{font-size:22px}
  .resumo{grid-template-columns:1fr 1fr}
  .resumo b{font-size:18px}
  .kpis{grid-template-columns:1fr}
  .toplists{grid-template-columns:1fr}
  .growth-list-scroll{min-height:0}
  /* DRE vira cards no celular */
  .dre-table{min-width:0}
  .dre-table thead{display:none}
  .dre-table tr{display:block;border-bottom:1px solid var(--line);padding:8px 12px}
  .dre-table td{display:flex;justify-content:space-between;gap:10px;border:0;padding:3px 0;text-align:right}
  .dre-table td:first-child{font-weight:700;text-align:left;padding-bottom:6px}
  .dre-table td[data-l]::before{content:attr(data-l);color:var(--ink2);font-weight:400;text-align:left}
  .dre-table tr.subgrupo-row td{padding:6px 0}
  .dre-table tfoot tr{background:var(--surface2)}
  .dre-table .tfoot-pad,.dre-table .sem-meta{display:none}
}

/* ================= v8: comparar, resumo, grupos, caiu, cascata, tema ================= */
div.ctxline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cmp-pick{position:relative;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;font-weight:500;color:var(--ink2);margin:0}
.cmp-pick select{appearance:none;-webkit-appearance:none;width:auto;min-height:30px;padding:4px 30px 4px 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--brand) 35%,var(--line));background:color-mix(in srgb,var(--brand) 8%,var(--surface));color:var(--brand);font-weight:700;font-size:13px;cursor:pointer}
.cmp-pick select:hover{border-color:var(--brand)}
.cmp-pick select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.cmp-pick{max-width:100%}.cmp-pick select{min-width:0;max-width:100%;text-overflow:ellipsis}
.cmp-pick svg{position:absolute;right:10px;width:14px;height:14px;fill:none;stroke:var(--brand);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

/* resumo em texto */
.rs-card{background:linear-gradient(150deg,color-mix(in srgb,var(--brand) 9%,var(--surface)),var(--surface) 55%);border:1px solid color-mix(in srgb,var(--brand) 22%,var(--line));border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 18px var(--sombra)}
.rs-head{display:flex;align-items:center;gap:12px}
.rs-head h3{font-size:17px;color:var(--ink)}
.rs-head .hint{margin:1px 0 0}
.rs-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--brand);color:#fff;flex:none}
.rs-ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.rs-lista{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
.rs-lista li{display:flex;gap:10px;align-items:flex-start}
.rs-lista p{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink)}
.rs-dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;margin-top:1px;background:color-mix(in srgb,var(--c) 15%,var(--tint));color:var(--c)}
.rs-dot svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.c-rec{color:var(--ok)}.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}.c-warn{color:var(--warn)}

/* despesas por grupo */
.dg-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.dg-leg{display:flex;gap:16px;font-size:12px;color:var(--ink2)}
.dg-leg span{display:inline-flex;align-items:center;gap:6px}
.dg-leg i{width:14px;height:7px;border-radius:3px;display:inline-block}
.dg-i-at,.dg-at{background:var(--brand)}
.dg-i-ant,.dg-ant{background:color-mix(in srgb,var(--ink2) 40%,transparent)}
.dg-row{display:grid;grid-template-columns:140px minmax(0,1fr) 112px 108px;align-items:center;gap:12px;padding:6px 0;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.dg-leg+.dg-row{border-top:0}
.dg-nome{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.dg-nome b{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg-nome small,.dg-val small{font-size:11.5px;font-weight:500;color:var(--ink2)}
.dg-val{font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;text-align:right;display:flex;flex-direction:column;line-height:1.25;white-space:nowrap}
.dg-bars{display:flex;flex-direction:column;gap:3px}
.dg-bars i{display:block;height:9px;border-radius:4px;transform-origin:left}
.dg-bars .dg-ant{height:5px}
.dg-var{font-weight:800;font-size:12.5px;white-space:nowrap;text-align:right}
.dg-var.sub{color:var(--bad)}.dg-var.des{color:var(--ok)}.dg-var.igual,.dg-var.novo{color:var(--ink2)}
.dg-nota{margin:auto 0 0;font-size:12px;color:var(--ink2)}
.dg-wrap{gap:4px}
@keyframes dgCresce{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* caiu */
.sect-up::before,.sect-down::before{content:"";display:inline-block;width:0;height:0;margin-right:7px;vertical-align:2px;border-left:5px solid transparent;border-right:5px solid transparent}
.sect-up::before{border-bottom:7px solid var(--ok)}
.sect-down::before{border-top:7px solid var(--bad)}
.caiu-delta{color:var(--bad);font-weight:600}
.growth-pct.down-bad{color:var(--bad)}
.caiu-nota{margin:8px 10px;font-size:12.5px;color:var(--ink2);background:color-mix(in srgb,var(--warn) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 25%,var(--line));border-radius:9px;padding:7px 11px}
.gc-cols .growth-list-scroll{min-height:0;max-height:460px}
.dual-cols>div>.pizza-wrap{flex:1;justify-content:center;gap:28px}
.dual-cols>div>.pizza-wrap .pizza{width:150px;height:150px}
.dual-cols>div>.pizza-wrap .pizza-legend{flex:0 1 auto}

/* cascata */
.wf-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1;justify-content:space-between}
.wf-row{display:grid;grid-template-columns:128px minmax(0,1fr) 118px;align-items:center;gap:10px;min-height:30px}
.wf-nome{font-size:13px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf-track{position:relative;height:22px;border-radius:6px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),color-mix(in srgb,var(--line) 60%,transparent) calc(25% - 1px) 25%)}
.wf-bar{position:absolute;top:0;bottom:0;border-radius:5px;transform-origin:left}
.wf-zero{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2);opacity:.6}
.wf-receita{--wc:var(--ok)}.wf-custo{--wc:var(--warn)}.wf-despesa{--wc:var(--brand)}.wf-resultado{--wc:var(--roxo)}.wf-negativo{--wc:var(--bad)}
.wf-bar{background:var(--wc)}
.wf-despesa.wf-bar{background:color-mix(in srgb,var(--brand) 78%,var(--tint))}
.wf-val{text-align:right;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;color:var(--wc);display:flex;flex-direction:column;line-height:1.2;white-space:nowrap}
.wf-val small{font-size:11px;font-weight:500;color:var(--ink2)}
.wf-total{border-top:1px dashed var(--line);padding-top:7px;margin-top:2px}
.wf-total .wf-nome{font-weight:800}
.wf-nota{margin:0;padding-top:6px;font-size:12px;color:var(--ink2)}

/* botão e menu de tema */
.tema-btn{width:38px;height:36px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.tema-btn:hover{background:var(--hover);border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.tema-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tema-menu{position:fixed;z-index:1000;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 18px 44px rgba(0,0,0,.22);display:flex;flex-direction:column;gap:2px;animation:tmEntra .16s ease-out}
.tm-tit{margin:4px 10px 6px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.tema-menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:14.5px;font-weight:600;color:var(--ink);background:none;border:0;border-radius:10px;padding:9px 10px;cursor:pointer}
.tema-menu button:hover,.tema-menu button:focus-visible{background:var(--hover);outline:none}
.tema-menu button.on{background:color-mix(in srgb,var(--brand) 12%,var(--surface));color:var(--brand)}
.tema-menu button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tema-menu button span{display:flex;flex-direction:column;line-height:1.25}
.tema-menu small{font-size:11.5px;font-weight:500;color:var(--ink2)}
.tema-menu i{margin-left:auto;font-style:normal;font-weight:900}
@keyframes tmEntra{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.tema-trocando,.tema-trocando *{transition:background-color .35s ease,color .35s ease,border-color .35s ease,fill .35s ease,stroke .35s ease!important}

/* ================= MODO ESCURO ================= */
:root[data-theme="dark"]{
  --bg:#0A1319; --surface:#111F27; --surface2:#1A2D37; --ink:#E4EEF2; --ink2:#9DB2BD; --line:#26404C;
  --brand:#2B8FA6; --accent:#E39A36; --ok:#46B784; --bad:#EF6B61; --warn:#E3963F;
  --roxo:#A08BF2; --tint:#111F27; --field:#0D1920; --hover:#1A3340; --mark-bg:#6A4D12; --sk-hi:#243A46; --sombra:rgba(0,0,0,.35);
  color-scheme:dark;
}
:root[data-theme="dark"] .mark path{stroke:#12212C}
:root[data-theme="dark"] .side{box-shadow:0 4px 18px rgba(0,0,0,.35)}
:root[data-theme="dark"] .tg{background:#3A5462}
:root[data-theme="dark"] img.tenant-logo{background:#fff}
:root[data-theme="dark"] .modal-bg{background:rgba(0,0,0,.6)}

@media (max-width:820px){
  .rs-lista{grid-template-columns:1fr}
}
@media (max-width:720px){
  .rs-card{padding:14px 14px}
  .rs-lista p{font-size:14px}
  .wf-row{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .wf-nome{grid-column:1;grid-row:1}
  .wf-val{grid-column:2;grid-row:1;flex-direction:row;align-items:baseline;gap:6px}
  .wf-track{grid-column:1/-1;grid-row:2;height:14px}
  .wf-wrap{gap:12px}
  .dg-row{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .dg-bars{grid-column:1;grid-row:2}
  .dg-var{grid-column:2;grid-row:2;font-size:12px}
  .dual-cols>div>.pizza-wrap .pizza{width:120px;height:120px}
  .wf-nome{font-size:12px}
  .wf-val{font-size:12px}
  .cmp-pick select{font-size:12.5px}
  .tema-btn{width:34px;height:32px}
}
@media (prefers-reduced-motion:reduce){
  .dg-bars i,.wf-bar,.tema-menu{animation:none}
}

/* ================= ANIMAÇÕES — RODADA 3 ================= */
/* 1. aparecer ao rolar */
.rv{opacity:0;transform:translateY(28px);animation:none!important}
.rv *{animation:none!important}
.rv-in{animation:aSobe .6s cubic-bezier(.2,.7,.2,1) both!important}
.rv-in.dual-cols>*:nth-child(2){animation:aSobe .6s cubic-bezier(.2,.7,.2,1) .12s both}
.rv-in :is(.rcards,.kpis,.toplists,.pj-nums)>*{animation:aSobe .5s cubic-bezier(.2,.7,.2,1) both}
.rv-in :is(.rcards,.kpis,.toplists,.pj-nums)>*:nth-child(2){animation-delay:.08s}
.rv-in :is(.rcards,.kpis,.toplists,.pj-nums)>*:nth-child(3){animation-delay:.16s}
.rv-in :is(.rcards,.kpis,.toplists,.pj-nums)>*:nth-child(n+4){animation-delay:.24s}
.rv-in :is(.rc-bar i,.barrow-fill,.cmp-bar-fill,.pj-dias i,.mg-bar,.abar){transform-origin:left center;animation:aBarra .9s cubic-bezier(.2,.7,.2,1) .3s both}
.rv-in .pizza{-webkit-mask:conic-gradient(#000 var(--ang),transparent 0);mask:conic-gradient(#000 var(--ang),transparent 0);animation:aPizza 1.1s cubic-bezier(.2,.7,.2,1) .25s both}
.rv-in .growth-row{animation:aLinha .35s cubic-bezier(.2,.7,.2,1) both}
.rv-in .growth-row:nth-child(2){animation-delay:.05s}.rv-in .growth-row:nth-child(3){animation-delay:.1s}.rv-in .growth-row:nth-child(4){animation-delay:.15s}.rv-in .growth-row:nth-child(5){animation-delay:.2s}.rv-in .growth-row:nth-child(n+6){animation-delay:.25s}
:is(.anim,.rv-in) .dg-bars i{animation:dgCresce .75s cubic-bezier(.2,.8,.2,1) .2s both}
:is(.anim,.rv-in) .dg-row:nth-of-type(n+3) .dg-bars i{animation-delay:.3s}
:is(.anim,.rv-in) .dg-row:nth-of-type(n+5) .dg-bars i{animation-delay:.4s}

/* 2. cascata em degraus */
.wf-wrap{position:relative}
.wf-bar{animation:none}
.wf-sai{transform-origin:right center}
.wf-lig{position:absolute;width:0;border-left:1.5px dashed color-mix(in srgb,var(--ink2) 60%,transparent);transform-origin:top;pointer-events:none;z-index:0}
@keyframes wfDegrau{from{opacity:0;transform:translateY(-8px) scaleX(0)}60%{opacity:1}to{opacity:1;transform:none}}
@keyframes wfLig{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
@keyframes wfVal{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
:is(.anim,.rv-in) .wf-bar{animation:wfDegrau .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 160ms + 150ms)}
:is(.anim,.rv-in) .wf-lig{animation:wfLig .25s ease-out both;animation-delay:calc(var(--i,0) * 160ms + 60ms)}
:is(.anim,.rv-in) .wf-val{animation:wfVal .4s ease-out both;animation-delay:calc(var(--i,0) * 160ms + 300ms)}
:is(.anim,.rv-in) .wf-total .wf-bar{animation-duration:.7s}

/* 3. transição do "comparar com" */
.mk-barra{transition:width .7s cubic-bezier(.2,.8,.2,1)}
@keyframes mkMudou{0%{background:color-mix(in srgb,var(--accent) 30%,transparent)}100%{background:transparent}}
.mk-mudou{animation:mkMudou 1.1s ease-out;border-radius:4px}

/* 4. resumo frase por frase */
.anim .rs-lista li{animation:aSobe .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.2s + var(--i,0) * .22s)}
.anim .rs-dot{animation:aPop .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(.3s + var(--i,0) * .22s)}

/* 5. troca de tema em círculo */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}
::view-transition-new(root){z-index:2}

/* 6. barra até o ponto de equilíbrio */
.pe-bar{position:relative;height:9px;border-radius:5px;background:var(--surface2);margin:24px 0 4px}
.pe-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transform-origin:left center}
.pe-fill{background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--brand)) 70%,var(--tint)),var(--c,var(--brand)))}
.pe-proj{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--roxo) 38%,transparent) 0 5px,transparent 5px 9px);border:1px dashed color-mix(in srgb,var(--roxo) 60%,transparent)}
.pe-marca{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px}
.pe-marca span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:2px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.kpi-pe .pe-marca span{transform:translateX(-85%)}
.pe-leg{font-size:12px;color:var(--ink2)}

@keyframes peMarca{0%{transform:scaleY(0)}70%{transform:scaleY(1.3)}100%{transform:none}}
:is(.anim,.rv-in) .pe-fill{animation:aBarra 1.1s cubic-bezier(.2,.7,.2,1) .35s both}
:is(.anim,.rv-in) .pe-proj{animation:aBarra 1.1s cubic-bezier(.2,.7,.2,1) .7s both}
:is(.anim,.rv-in) .pe-marca{animation:peMarca .45s cubic-bezier(.2,1.4,.4,1) 1.1s both}

@keyframes peBrilho{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 2px var(--ok),0 0 34px color-mix(in srgb,var(--ok) 45%,transparent)}}
.confete{position:fixed;width:7px;height:10px;border-radius:2px;z-index:1200;pointer-events:none}

/* 7. setas com um pulinho */
.seta{display:inline-block}
@keyframes aPulo{0%{transform:translateY(0) scale(.6);opacity:0}40%{transform:translateY(-6px) scale(1.18);opacity:1}70%{transform:translateY(1px) scale(.97)}100%{transform:none;opacity:1}}

:is(.anim,.rv-in) .growth-pct{display:inline-block;animation:aPulo .55s cubic-bezier(.3,1.5,.5,1) .55s both}
:is(.anim,.rv-in) :is(.sect-up,.sect-down)::before{animation:aPulo .55s cubic-bezier(.3,1.5,.5,1) .4s both}

/* 8. luz que segue o mouse */
.kpi,.dchip{position:relative;overflow:hidden}
.kpi.good{--c:var(--ok)}.kpi.warn{--c:var(--warn)}.kpi.bad{--c:var(--bad)}
@media (hover:hover) and (pointer:fine){
  :is(.rcard,.kpi,.dchip)::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s ease;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--c,var(--brand)) 22%,transparent),transparent 70%)}
  :is(.rcard,.kpi,.dchip):hover::before{opacity:1}
  :root[data-theme="dark"] :is(.rcard,.kpi,.dchip)::before{background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--c,var(--brand)) 26%,transparent),transparent 70%)}
}

}

<script>
/* ================= Viéstec Gestor — site standalone (Financeiro) =================
   Fora do artefato: fala direto com o Supabase (banco + auth).
   Login por usuário/senha traduz pra um e-mail interno via a função
   public.username_to_email(), depois autentica normal no Supabase Auth. */

const SUPABASE_URL = 'https://kcideuvlomoyiamqqavy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjaWRldXZsb21veWlhbXFxYXZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMTI3MDQsImV4cCI6MjEwNTY4ODcwNH0.O4cvcJNWiWpE-CqhwNTb05uyqeIr-x8718EHT9GvzJc';
const sb = window.supabase ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const MARK = `<svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M8 10l6 13 10-15" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' }).format(n || 0);
const pct = n => new Intl.NumberFormat('pt-BR', { style:'percent', maximumFractionDigits:1 }).format(n || 0);
const mesLabel = c => { if (!c) return '—'; const [a,m] = c.split('-'); return new Date(a, m-1, 1).toLocaleDateString('pt-BR', { month:'long', year:'numeric' }); };
const capitaliza = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function mesAtualReal(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }

const state = { session:null, perfil:null, cliente:null, unidades:[], unidadeId:'', competencia:'', competenciaAnterior:'', competenciaComparar:'', lancCmp:{}, tab:'painel', dreFechados:new Set(), flash:null, contas:[], lanc:{}, lancAnt:{}, hist:{}, histMeses:[], config:null, ultimaImport:null, detMes:'' };
const MESES_HIST = 13; // 13 = dá pra comparar com o mesmo mês do ano passado
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESES_CURTOS = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mesCurto = c => { const [a,m] = c.split('-'); return MESES_CURTOS[+m-1] + '/' + a.slice(2); };

function mesAnterior(c){ const [a,m] = c.split('-').map(Number); const d = new Date(a, m-2, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function mesesAte(c, n){ const out = [c]; while (out.length < n) out.unshift(mesAnterior(out[0])); return out; }

const ehErroDeRede = e => !navigator.onLine || e instanceof TypeError || /fetch|network|conex/i.test((e && e.message) || '');

function renderOffline(){
  $('#app').innerHTML = `<div class="login"><div class="lg-card off-card">
    <div class="wordmark">${MARK}<div>Viéstec <span>Gestor</span></div></div>
    <h1>Sem conexão</h1>
    <p class="lg-sub">Os números do restaurante vêm do servidor. Confira a internet do celular e tente de novo.</p>
    <button class="lg-btn" type="button" id="tentar"><span class="lg-btn-txt">Tentar de novo</span></button>
  </div></div>`;
  $('#tentar').onclick = () => location.reload();
}
window.addEventListener('online', () => { if (document.querySelector('.off-card')) location.reload(); });

async function boot(){
  if (!sb) return renderOffline();
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  if (!state.session) return renderLogin();
  renderCarregandoApp();
  try { await carregarContexto(); render(); }
  catch (e) {
    console.error(e);
    if (ehErroDeRede(e)) return renderOffline();
    await sb.auth.signOut(); renderLogin('Sessão expirada, entre novamente.');
  }
}

async function carregarContexto(){
  const uid = state.session.user.id;
  const { data: perfil, error } = await sb.from('perfis').select('*').eq('user_id', uid).maybeSingle();
  if (error) throw error;
  if (!perfil) throw new Error('Perfil não encontrado pra esse usuário.');
  state.perfil = perfil;
  // As unidades já vêm filtradas pelo banco (RLS): o dono (owner) vê todas, os demais
  // veem só as unidades liberadas pra eles (tabela perfil_unidades) — isolamento por unidade.
  const { data: unidades } = await sb.from('unidades').select('*').order('nome');
  state.unidades = unidades || [];
  if (!state.unidadeId || !state.unidades.some(u => u.id === state.unidadeId)) {
    state.unidadeId = state.unidades.length ? state.unidades[0].id : '';
  }
  const clienteId = (state.unidades.find(u => u.id === state.unidadeId) || {}).cliente_id || perfil.cliente_id;
  if (clienteId) {
    const { data: cliente } = await sb.from('clientes').select('*').eq('id', clienteId).maybeSingle();
    state.cliente = cliente;
    const { data: cfg } = await sb.from('config_financeiro').select('*').eq('cliente_id', clienteId).maybeSingle();
    state.config = cfg;
  }
  if (state.unidadeId) {
    // Sempre abre no mês corrente (data real de hoje) — o usuário troca manualmente se quiser ver outro mês.
    if (!state.competencia) state.competencia = mesAtualReal();
    state.competenciaAnterior = mesAnterior(state.competencia);
    await carregarMes();
  }
}
async function carregarMes(){
  if (typeof detCache !== 'undefined') Object.keys(detCache).forEach(k => delete detCache[k]);
  const { data: contas } = await sb.from('fin_contas').select('*').eq('unidade_id', state.unidadeId).order('codigo');
  state.contas = contas || [];
  // Histórico dos últimos 12 meses (inclui o mês atual e o anterior) — paginado de 1000 em 1000.
  const meses = mesesAte(state.competencia, MESES_HIST);
  const linhas = [];
  for (let de = 0; ; de += 1000) {
    const { data, error } = await sb.from('fin_lancamentos').select('competencia,codigo_conta,valor')
      .eq('unidade_id', state.unidadeId).gte('competencia', meses[0]).lte('competencia', state.competencia)
      .order('competencia').range(de, de + 999);
    if (error) throw error;
    linhas.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  const hist = {};
  for (const l of linhas) (hist[l.competencia] = hist[l.competencia] || {})[l.codigo_conta] = Number(l.valor);
  state.hist = hist;
  state.histMeses = meses;
  state.lanc = hist[state.competencia] || {};
  state.lancAnt = hist[state.competenciaAnterior] || {};
  if (state.competenciaComparar && !meses.includes(state.competenciaComparar)) state.competenciaComparar = '';
  state.lancCmp = hist[mesCmp()] || {};
  const { data: ult } = await sb.from('importacoes').select('criado_em')
    .eq('unidade_id', state.unidadeId).eq('competencia', state.competencia)
    .order('criado_em', { ascending:false }).limit(1);
  state.ultimaImport = ult && ult[0] ? ult[0].criado_em : null;
}

function totaisPorTipo(mapa){
  const t = { receita:0, custo:0, despesa:0, outros:0 };
  for (const c of state.contas) t[c.tipo] = (t[c.tipo] || 0) + (mapa[c.codigo] || 0);
  return t;
}

/* ================= TERMOS E PRIVACIDADE (desligado por enquanto: sem links na tela) =================
   Texto base. Os campos entre [colchetes] precisam ser preenchidos, e o texto

const LEGAL_ATUALIZADO = '23 de setembro de 2026';

const TEXTO_TERMOS = `
<p>Estes Termos de Uso regulam o acesso ao <b>Viéstec Gestor</b>, sistema de gestão financeira para restaurantes oferecido por ${LEGAL_EMPRESA}, CNPJ ${LEGAL_CNPJ} ("Viéstec"). Ao entrar no sistema, você concorda com estes termos.</p>
<h3>1. O que é o sistema</h3>
<p>O Viéstec Gestor organiza os números do restaurante a partir dos relatórios importados pelo próprio cliente (como o DRE exportado do sistema de PDV) e mostra DRE, metas, margens, alertas, indicadores e projeções.</p>

const TEXTO_PRIVACIDADE = `
<p>Esta Política explica como o <b>Viéstec Gestor</b>, de ${LEGAL_EMPRESA}, CNPJ ${LEGAL_CNPJ}, trata dados pessoais, em conformidade com a Lei Geral de Proteção de Dados (Lei nº 13.709/2018 – LGPD).</p>
<h3>1. Quais dados tratamos</h3>
<p><b>Dados de acesso:</b> nome de usuário e senha (a senha é guardada de forma criptografada e ninguém da Viéstec consegue lê-la).<br>
