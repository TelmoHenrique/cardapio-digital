/* ================= PROJEÇÃO DO MÊS ================= */
function ehDespVariavel(c){
  const n = normName(c.nome);
  return (String(c.codigo).startsWith('3.2.') && !n.includes('IPTU')) || String(c.codigo).startsWith('3.7.') || n.includes('COMISS');
}
function projecaoMes(t){
  if (state.competencia !== mesAtualReal()) return null;
  const [a, m] = state.competencia.split('-').map(Number);
  const diasMes = new Date(a, m, 0).getDate();
  let corte = new Date();
  if (state.ultimaImport) { const d = new Date(state.ultimaImport); if (d.getFullYear() === a && d.getMonth() + 1 === m) corte = d; }
  const dias = corte.getDate();
  if (!t.receita || dias >= diasMes) return null;
  const fator = diasMes / dias;
  let despesa = 0;
  for (const c of state.contas.filter(c => c.tipo === 'despesa')) {
    const atual = state.lanc[c.codigo] || 0, ant = state.lancAnt[c.codigo] || 0;
    despesa += ehDespVariavel(c) ? atual * fator : Math.max(atual, ant);
  }
  const receita = t.receita * fator, custo = t.custo * fator;
  return { dias, diasMes, receita, custo, despesa, resultado: receita - custo - despesa,
    metaRec: metaConta('receita', totaisPorTipo(state.lancAnt).receita) };
}
function viewProjecao(t){
  const p = projecaoMes(t);
  if (!p) return '';
  const mAtu = MESES[+state.competencia.split('-')[1] - 1];
  const pos = p.resultado >= 0;
  const metaTxt = p.metaRec ? `<span class="pj-meta ${p.receita >= p.metaRec ? 'good' : 'bad'}">receita prevista = ${pct(p.receita / p.metaRec)} da meta</span>` : '';
  return `<section class="pj">
    <div class="pj-head">
      <div><h3>Projeção de ${mAtu}</h3><p class="hint">Dados até o dia ${p.dias} de ${p.diasMes} · estimativa se o ritmo continuar igual</p></div>
      ${metaTxt}
    </div>
    <div class="pj-dias"><i style="width:${p.dias / p.diasMes * 100}%"></i></div>
    <div class="pj-nums">
      <div class="t-receita"><span>Receita prevista</span><b>${brl(p.receita)}</b></div>
      <div class="t-custo"><span>Custo previsto</span><b>${brl(p.custo)}</b></div>
      <div class="t-despesa"><span>Despesas estimadas</span><b>${brl(p.despesa)}</b></div>
      <div class="t-resultado ${pos ? 'pos' : 'neg'}"><span>Resultado previsto</span><b>${brl(p.resultado)}</b></div>
    </div>
    <p class="pj-nota">Receita e custo seguem a média por dia até agora. Nas despesas fixas (aluguel, salários etc.) usamos o maior valor entre o que já foi lançado e o do mês anterior; impostos, taxas e comissões acompanham as vendas.</p>
  </section>`;
}

/* ================= PONTO DE EQUILÍBRIO ================= */
function pontoEquilibrio(t){
  const aberto = state.competencia === mesAtualReal();
  const usarAnt = aberto && Object.keys(state.lancAnt).length > 0;
  const mapa = usarAnt ? state.lancAnt : state.lanc;
  const tot = usarAnt ? totaisPorTipo(state.lancAnt) : t;
  if (!tot.receita) return null;
  let desVar = 0, desFix = 0;
  for (const c of state.contas.filter(c => c.tipo === 'despesa')) {
    const v = mapa[c.codigo] || 0;
    if (ehDespVariavel(c)) desVar += v; else desFix += v;
  }
  const mc = (tot.receita - tot.custo - desVar) / tot.receita;
  if (mc <= 0) return { invalido:true };
  const [a, m] = state.competencia.split('-').map(Number);
  const diasMes = new Date(a, m, 0).getDate();
  const pe = desFix / mc;
  const proj = aberto ? projecaoMes(t) : null;
  const referencia = proj ? proj.receita : t.receita;
  return { pe, porDia: pe / diasMes, mc, desFix, base: usarAnt ? state.competenciaAnterior : state.competencia, referencia, porProjecao: !!proj };
}
function kpiPontoEquilibrio(t){
  const r = pontoEquilibrio(t);
  if (!r) return '';
  if (r.invalido) return `<div class="kpi bad"><span class="kpi-label">Ponto de equilíbrio</span><span class="kpi-val">—</span><span class="kpi-ref">custos variáveis maiores que a receita</span></div>`;
  const ok = r.referencia >= r.pe;
  const dif = r.referencia / r.pe - 1;
  const mil = v => 'R$ ' + (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits:1 }) + ' mil';
  const baseTxt = r.base !== state.competencia ? ` · base: ${MESES[+r.base.split('-')[1] - 1]}` : '';
  return `<div class="kpi ${ok ? 'good' : 'bad'}" title="Despesas fixas ÷ margem de contribuição (${pct(r.mc)})">
    <span class="kpi-label">Ponto de equilíbrio</span>
    <span class="kpi-val">${mil(r.pe)}</span>
    <span class="kpi-ref">${brl(r.porDia)} por dia${baseTxt}</span>
    <span class="kpi-var">${r.porProjecao ? 'projeção' : 'receita do mês'}: ${mil(r.referencia)} (${dif >= 0 ? '+' : ''}${pct(dif)})</span>
  </div>`;
}

/* ================= Importar contas (PDF Tacto) =================
   Fora do artefato dá pra usar pdf.js de verdade (CDN) em vez do parser
   nativo de bytes que o artefato precisava por causa da sandbox. A partir
   daqui reaproveita exatamente a lógica original de leitura das linhas do
   relatório (parseAccountLine / dropSubtotalRows / detectCompetencia). */

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
}

const MONTH_NAME_TO_NUM = { JANEIRO:'01', FEVEREIRO:'02', MARCO:'03', ABRIL:'04', MAIO:'05', JUNHO:'06', JULHO:'07', AGOSTO:'08', SETEMBRO:'09', OUTUBRO:'10', NOVEMBRO:'11', DEZEMBRO:'12' };
const TIPOS = [['receita','Receitas'], ['custo','Custos'], ['despesa','Despesas'], ['outros','Outros']];
let imp = null;

function normName(s){
  return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
}

function parseAccountLine(line){
  const tokens = line.split(' ').filter(Boolean);
  if (tokens.length < 6) return null;
  const pctTok = tokens[tokens.length-1];
  if (!/%$/.test(pctTok)) return null;
  const valTok = tokens[tokens.length-2];
  const signTok = tokens[tokens.length-3];
  if (!/^-?R\$$/.test(signTok)) return null;
  const levelTok = tokens[tokens.length-4];
  if (!/^\d+$/.test(levelTok)) return null;
  if (levelTok === '0') return null; // total do grupo (RECEITA / CUSTOS TOTAIS / DESPESAS TOTAIS)
  const code = tokens[1];
  const nameTokens = tokens.slice(2, tokens.length-4);
  if (!nameTokens.length) return null;
  let nameRaw = nameTokens.join(' ');
  if (nameRaw.indexOf('*') !== -1) return null; // subtotal de departamento, não é conta-folha
  const name = nameRaw.replace(/^>+/, '').trim();
  if (!name) return null;
  const numStr = valTok.replace(/\./g,'').replace(',', '.');
  const value = Math.abs(parseFloat(numStr));
  if (isNaN(value)) return null;
  return {name, value, code, nivel: parseInt(levelTok, 10)};
}

function dropSubtotalRows(rows){
  const codes = rows.map(r=>r.code).filter(Boolean);
  return rows.filter(r=>{
    if (!r.code) return true;
    return !codes.some(c => c !== r.code && c.indexOf(r.code + '.') === 0);
  });
}

function detectCompetencia(texto){
  const m = texto.match(/\b(\d{4})\s*-\s*([A-ZÇÃÕÁÉÍÓÚ]+)/i);
  if (!m) return null;
  const mm = MONTH_NAME_TO_NUM[normName(m[2])];
  return mm ? m[1] + '-' + mm : null;
}

function rowsFromReportLines(lines){
  let rows = [];
  lines.forEach(line => { const p = parseAccountLine(line); if (p) rows.push(p); });
  rows = dropSubtotalRows(rows);
  return { rows, competencia: detectCompetencia(lines.join(' ')) };
}

// Agrupa itens de texto do pdf.js em linhas (mesma ideia do artefato: tolerância
// vertical proporcional ao tamanho da fonte, espaço decidido pelo vão horizontal).
function itemsToLines(items){
  const valid = items.filter(it => it.str && it.str.length);
  if (!valid.length) return [];
  const sorted = valid.slice().sort((a, b) => (b.y - a.y) || (a.x - b.x));
  const rows = [];
  sorted.forEach(it => {
    const last = rows[rows.length - 1];
    const tol = Math.max(1.5, 0.4 * (it.size || 10));
    if (last && Math.abs(last.y - it.y) <= tol) last.items.push(it);
    else rows.push({ y: it.y, items: [it] });
  });
  return rows.map(row => {
    const its = row.items.slice().sort((a, b) => a.x - b.x);
    let line = '';
    let prevEnd = null;
    its.forEach(it => {
      const gap = prevEnd === null ? 0 : it.x - prevEnd;
      const thr = 0.18 * (it.size || 10);
      if (prevEnd !== null && gap > thr && !/\s$/.test(line) && !/^\s/.test(it.str)) line += ' ';
      line += it.str;
      prevEnd = it.x + (it.w || 0);
    });
    return line.replace(/\s+/g, ' ').trim();
  });
}

async function pdfjsExtractLines(file){
  if (!window.pdfjsLib) throw new Error('Biblioteca de leitura de PDF não carregou. Verifique sua conexão e tente de novo.');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const allLines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items.map(it => ({
      str: it.str,
      x: it.transform[4],
      y: it.transform[5],
      size: Math.hypot(it.transform[2], it.transform[3]) || 10,
      w: it.width || 0
    }));
    itemsToLines(items).forEach(l => { if (l) allLines.push(l); });
  }
  return allLines;
}

const raizCod = c => String(c).split('.')[0];
function adivinharTipos(rows, plano){
  const porCod = new Map(plano.map(c => [c.codigo, c.tipo]));
  const porRaiz = {};
  rows.forEach(r => {
    let t = porCod.get(r.code);
    r.nova = !porCod.has(r.code);
    if (!t) {
      const primeira = normName(r.name).split(' ')[0];
      if (primeira === 'VENDAS') t = 'receita';
      else if (primeira === 'CUSTO' || primeira === 'CUSTOS') t = 'custo';
      else t = porRaiz[raizCod(r.code)] || 'despesa';
    }
    r.tipo = t;
    porRaiz[raizCod(r.code)] = t;
  });
}

async function carregarHistoricoImport(){
  const unidade = state.unidadeId;
  const { data, error } = await sb.from('importacoes')
    .select('criado_em,arquivo,competencia,contas_lidas,status')
    .eq('unidade_id', unidade).eq('modulo', 'financeiro')

  if (error) { box.innerHTML = '<p class="ih-empty">Não foi possível carregar o histórico agora.</p>'; return; }
  if (!data || !data.length) { box.innerHTML = '<p class="ih-empty">Nenhuma importação registrada ainda. Os próximos PDFs importados vão aparecer aqui, com data e horário.</p>'; return; }
  const hoje = new Date(); const ontem = new Date(Date.now() - 864e5);
  const mesmoDia = (a, b) => a.toDateString() === b.toDateString();

      const hora = d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });

        <span class="ih-arq" title="${esc(r.arquivo)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>${esc(r.arquivo || '—')}</span>
        <span class="ih-comp">${r.competencia ? esc(capitaliza(mesLabel(r.competencia))) : '—'}</span>

async function impAbrir(file){
  const box = $('#impArea'); if (!box) return;
  box.innerHTML = '<p class="loading">Lendo o PDF…</p>';
  try {
    const lines = await pdfjsExtractLines(file);
    const out = rowsFromReportLines(lines);
    if (!out.rows.length) { impFalha('Não encontrei contas neste arquivo. Ele precisa ser o relatório DRE da Tacto em PDF.'); return; }
    const plano = state.contas.map(c => ({ codigo:c.codigo, tipo:c.tipo }));
    imp = { file, rows: out.rows, competencia: out.competencia };
    adivinharTipos(imp.rows, plano);
    impRenderPreview();
  } catch (e) {
    console.error(e);
    impFalha('Não consegui ler o PDF: ' + ((e && e.message) || 'erro desconhecido'));
  }
}

function impFalha(msg){
  const box = $('#impArea'); if (!box) return;
  box.innerHTML = `<div class="preview"><p>${esc(msg)}</p>
    <div class="preview-foot"><button class="btn ghost" id="impRetry" type="button">Tentar de novo</button></div></div>`;
  $('#impRetry').addEventListener('click', () => { box.innerHTML = ''; $('#pdfFile').value = ''; });
}

function impRenderPreview(){
  const box = $('#impArea'); if (!box || !imp) return;
  const comp = imp.competencia || state.competencia;
  const novas = imp.rows.filter(r => r.nova).length;
  box.innerHTML = `<div class="preview">
    <div class="preview-head">
      <div><b>${esc(imp.file.name)}</b>
        <p class="hint">${imp.rows.length} contas lidas · ${novas} nova${novas === 1 ? '' : 's'} no plano · ${imp.competencia ? 'competência detectada no arquivo' : 'competência não detectada: confira o mês'}.</p></div>
      <div class="ctl2"><label for="impMes">Competência</label><input id="impMes" type="month" value="${esc(comp)}"></div>
    </div>
    <p class="warn-line" id="impAviso"></p>
    <div class="tablewrap"><table><thead><tr><th>Código</th><th>Conta</th><th class="num">Valor</th><th>Tipo</th><th></th></tr></thead><tbody>
    ${imp.rows.map((r, i) => `<tr><td class="mono">${esc(r.code)}</td><td>${esc(r.name)}</td><td class="num">${brl(r.value)}</td>
      <td><select data-i="${i}" aria-label="Tipo da conta ${esc(r.name)}">${TIPOS.map(o => `<option value="${o[0]}"${o[0] === r.tipo ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select></td>
      <td>${r.nova ? '<span class="pill ok">Nova</span>' : '<span class="pill">Existente</span>'}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="preview-foot"><button class="btn ghost" id="impCancel" type="button">Cancelar</button><button class="btn" id="impApply" type="button">Aplicar importação</button></div>
  </div>`;
  const avisar = () => {
    const mes = $('#impMes').value;
    const aviso = $('#impAviso');
    aviso.textContent = '';
    if (!mes) return;
    sb.from('fin_lancamentos').select('codigo_conta').eq('unidade_id', state.unidadeId).eq('competencia', mes).limit(1).then(({ data }) => {
      if ($('#impMes') && $('#impMes').value === mes && data && data.length)
        aviso.textContent = 'Já existem lançamentos de ' + mesLabel(mes) + ' nesta unidade. Ao aplicar, todos os valores desse mês serão substituídos pelos deste PDF (contas que não estiverem no arquivo ficam zeradas).';
    });
  };
  $('#impMes').addEventListener('change', avisar); avisar();
  $('#impCancel').addEventListener('click', () => { imp = null; box.innerHTML = ''; $('#pdfFile').value = ''; });
  $('#impApply').addEventListener('click', impAplicar);
}

async function impAplicar(){
  if (!imp) return;
  const mes = $('#impMes').value;
  if (!mes) { toast('Informe a competência.'); return; }
  const btn = $('#impApply'); btn.disabled = true; btn.textContent = 'Gravando…';
  document.querySelectorAll('#impArea select[data-i]').forEach(s => { imp.rows[+s.dataset.i].tipo = s.value; });
  try {
    const contasPorCodigo = new Map(state.contas.map(c => [c.codigo, c]));
    const valores = {};
    const contasUpsert = [];
    imp.rows.forEach(r => {
      valores[r.code] = (valores[r.code] || 0) + r.value;
      contasUpsert.push({
        unidade_id: state.unidadeId,
        codigo: r.code,
        nome: r.name,
        nivel: r.nivel,
        pai_codigo: r.code.indexOf('.') > -1 ? r.code.slice(0, r.code.lastIndexOf('.')) : null,
        tipo: r.tipo
      });
    });
    const { error: e1 } = await sb.from('fin_contas').upsert(contasUpsert, { onConflict: 'unidade_id,codigo' });
    if (e1) throw e1;
    // Substitui o mês inteiro numa única operação no banco: apaga tudo daquele mês e grava
    // só o que veio no PDF. Se der erro, nada é apagado.
    const itens = Object.entries(valores).map(([codigo_conta, valor]) => ({ codigo_conta, valor }));
    const { error: e2 } = await sb.rpc('substituir_lancamentos_mes', { p_unidade: state.unidadeId, p_competencia: mes, p_itens: itens });
    if (e2) throw e2;
    if (state.perfil && state.perfil.cliente_id) {
      await sb.from('importacoes').insert({
        cliente_id: state.perfil.cliente_id, unidade_id: state.unidadeId, modulo: 'financeiro',
        competencia: mes, arquivo: imp.file.name, status: 'ok', contas_lidas: imp.rows.length
      });
    }
    toast('Importação aplicada: ' + imp.rows.length + ' contas em ' + mesLabel(mes) + '.');
    imp = null;
    state.competencia = mes;
    state.competenciaAnterior = mesAnterior(mes);
    state.tab = 'dre';
    await carregarMes();
    render();
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.textContent = 'Aplicar importação';
    toast('Não foi possível gravar a importação.');
  }
}

window.addEventListener('resize', () => { if (state.tab === 'painel') sincronizarAlturaPainel(); });
sb.auth.onAuthStateChange((_evt, session) => { if (!session && state.session) { state.session = null; renderLogin(); } });
boot();
</script>
